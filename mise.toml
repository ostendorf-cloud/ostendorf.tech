# Every tool this repository needs, pinned. CI installs from this same file through
# mise-action, so local and CI run identical versions. Nothing is installed any other way.
[tools]
go = "1.27.4"
task = "3"
# The web/ package. pnpm is the package manager, so npm is never called directly.
# pnpm is pinned to the patch, not the major: the Dockerfile's Node stage installs one
# version, its PNPM_VERSION argument, and the lockfile that stage reads with
# --frozen-lockfile has to have been written by the same one. A floating major silently
# drifts the two apart. Renovate moves both in one pull request (group "pnpm").
#
# Pinned to major 12, not 10: pnpm 10.34.7 never writes a git-hosted dependency's
# "path" subdirectory field into the lockfile's resolution object, not only on an
# upgrade but even on a fully fresh resolve against a cold store (verified locally;
# the dependency key's own "#path:/web" suffix is unaffected and cosmetic, since
# "pnpm install --frozen-lockfile" reads resolution.path, not the key, to decide what
# to extract). That is pnpm/pnpm#12304, fixed by pnpm/pnpm#12344; nothing in that fix
# was backported to the 10.x release line. pnpm 11.28.11 carries the fix too, so 12 is
# one major beyond the strict minimum; it is chosen to match the sibling repository
# rather than put a third pnpm major into the organisation. 12.19.0 is the patch a cold-store install
# and a cold-store "pnpm install --frozen-lockfile" were both verified against here.
#
# Regenerating web/pnpm-lock.yaml: pnpm 12 enforces a minimum release age and refuses a
# package published within roughly the last day with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION.
# Preserving an existing lockfile then fails where a full fresh resolve succeeds, so
# regenerate from scratch rather than fighting it. Verify the result with a frozen install
# into an empty directory with a cold store: inspecting web/node_modules proves nothing,
# because --frozen-lockfile leaves an already populated tree untouched.
node = "26"
pnpm = "12.23.0"
# Pinned to the patch, not "2": a golangci-lint release is built against one Go patch and
# cannot read the stdlib export data of a newer one, so the two versions move together.
golangci-lint = "2.15.0"
actionlint = "1"
markdownlint-cli2 = "0.24.2"
yamllint = "1"
gitleaks = "8"
hadolint = "2"
# scripts/ holds the image smoke test, so the shell gets the same treatment as
# every other language here: a linter and a formatter, both pinned.
shellcheck = "0.11"
shfmt = "3"
# Pinned to the 3.x line, not 4.x: the helm-unittest plugin used to verify
# charts/ostendorf.tech targets Helm 3's plugin API.
helm = "4.3.2"
kubeconform = "0.8.0"
# poppler provides pdftocairo, used once to convert the wordmark from PDF to SVG; see
# AGENTS.md for the exact command. svgo then optimises the result.
poppler = "26.11.0"
"npm:svgo" = "4.1.0"
# imagemagick encodes the two photographs into the AVIF and WebP variants
# web/src/assets holds, again once rather than on every build; see AGENTS.md for the
# commands. It also renders the favicon PNG files and the social preview image from the
# SVG sources (task favicon:generate). Pinned to the patch like every other encoder here, because the output bytes
# are committed and a different version would rewrite every one of them on the next run.
imagemagick = "7.1.2_31"

# helm-unittest (charts/ostendorf.tech's own verification plugin) is a Helm plugin, not a
# conventional CLI, and the baseline forbids "helm plugin install <url>" regardless of Helm
# version, so it is pinned through mise's generic "github:" backend instead, the same
# version "task test:helm" already targeted (v1.2.1): mise downloads and checksums the one
# release asset built for the current OS and architecture, and "postinstall" then copies
# that directory straight into Helm's own plugin folder, never through Helm's own installer,
# so there is nothing left for Helm to ask to verify. "rename_exe" undoes mise's own default
# of stripping the OS/arch suffix off a single-binary download, which plugin.yaml needs kept
# to find the right binary by name.
[tools."github:helm-unittest/helm-unittest"]
version = "1.2.1"
depends = ["helm"]
postinstall = "rm -rf \"$(helm env HELM_PLUGINS)/helm-unittest\" && mkdir -p \"$(helm env HELM_PLUGINS)\" && cp -r \"$MISE_TOOL_INSTALL_PATH\" \"$(helm env HELM_PLUGINS)/helm-unittest\""

[tools."github:helm-unittest/helm-unittest".platforms]
linux-x64 = { rename_exe = "untt-linux-amd64" }
macos-arm64 = { rename_exe = "untt-macos-arm64" }
