services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
      # Dockerfile now builds two final stages, "website" and "feed";
      # without this, a plain "docker build ." would still resolve to
      # "website" since it is the last stage in the file, but naming it
      # here keeps that from being implicit.
      target: website
    restart: unless-stopped
    environment:
      # ALLOW_PLAIN_HTTP: this compose file serves the site over plain
      # HTTP on localhost, with nothing terminating TLS in front of it;
      # without this the session cookie's Secure attribute would keep a
      # browser from ever sending it back, and the contact form's CSRF
      # protection with it. Never set this on anything reachable from
      # outside the machine it runs on.
      ALLOW_PLAIN_HTTP: "true"
      CSRF_KEY: "${CSRF_KEY:?Set CSRF_KEY, e.g. via: openssl rand -hex 32}"
      CHALLENGE_KEY: "${CHALLENGE_KEY}"
      SMTP_ADDR: "${SMTP_ADDR}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      CONTACT_TO: "${CONTACT_TO}"
      CONTACT_FROM: "${CONTACT_FROM}"
      # Page view counting is off unless both are set in .env or the shell.
      # Empty values count as unset.
      UMAMI_URL: "${UMAMI_URL:-}"
      UMAMI_WEBSITE_ID: "${UMAMI_WEBSITE_ID:-}"
    ports:
      - "127.0.0.1:8080:8080"
