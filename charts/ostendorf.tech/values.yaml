# Default values for ostendorf-tech.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Must stay at 1 or drop to 0; never go above 1. internal/webapp/session.go
# keeps the anonymous session the CSRF protector relies on in govue's
# in-process session.MemoryStore. A second replica, or two pods briefly
# coexisting during an ordinary rolling update, can answer a visitor's GET
# on one pod and their contact form POST on another pod that never saw that
# session: requireSession then refuses that POST with 403, correctly from
# that pod's point of view but wrongly from the visitor's, since their
# session is real, just on the other pod. This breaks the contact form for
# real visitors; it is an availability problem, not a security hole.
# templates/deployment.yaml rejects any value above 1 at render time and
# runs the Deployment with strategy.type: Recreate, so a rollout never lets
# two pods coexist either. Raise this above 1 only once the webapp moves to
# a shared session store; see AGENTS.md.
#
# 0 is deliberately still allowed (values.schema.json's own minimum is 0):
# stopping the site entirely, for a maintenance window or to pause the
# deployment, is a legitimate, intentional use of replicaCount that the
# single-pod guard above was never meant to prevent; it guards against more
# than one pod existing, not against zero. Scaling back up from 0 is a
# normal start, not a rollout, so it raises no second-pod risk either.
replicaCount: 1

image:
  repository: ghcr.io/ostendorf-cloud/ostendorf.tech
  # Defaults to .Chart.AppVersion when left empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # No RBAC is created: this application makes no Kubernetes API calls of its own.
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Matches the Dockerfile's distroless "nonroot" base image, uid/gid 65532.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  # Also used as the container port and for the probes: must match the port
  # encoded in config.listenAddr (default ":8080" for both). This is the
  # only port the chart's own Ingress or HTTPRoute ever routes to.
  port: 8080
  # govue's admin listener: health, readiness and metrics, never routed by
  # this chart's own Ingress or HTTPRoute (templates/ingress.yaml and
  # templates/httproute.yaml only ever reference service.port above).
  # Reached only from inside the cluster, by a kubelet's probe or a
  # Prometheus ServiceMonitor/PodMonitor (not part of this chart). Must
  # match the port encoded in config.adminListenAddr (default ":8081" for
  # both).
  adminPort: 8081

# Ingress and httpRoute below are two ways to reach this chart's own Service
# externally, chosen by their own enabled flag. Mutually exclusive (see
# templates/deployment.yaml's own fail guard): an install never renders
# both for the same hostname. Both default to false, so a default install
# renders no external route at all until one of the two is chosen.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ostendorf.tech
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API alternative to ingress above; see that block's own comment for
# the mutual-exclusion rule.
#
# The HTTPRoute and Gateway kinds are Gateway API CRDs. This chart never
# ships them (see kubernetes-conventions) and never creates the Gateway
# itself: both the CRDs and a running Gateway with a listener that allows
# this release's namespace are prerequisites, provisioned once per cluster,
# not by this chart.
httpRoute:
  enabled: false
  # Hostnames this HTTPRoute matches, mirroring ingress.hosts' host field.
  # A Gateway listener's own hostname (and allowedRoutes) still decides
  # whether traffic for one of these actually reaches this HTTPRoute; see
  # kubernetes-conventions.
  hostnames: []
  annotations: {}
  # Routing is fixed to this chart's own Service on service.port: no
  # values-driven way to add a second backend or a per-path rule, the same
  # single-backend shape ingress.hosts already assumes. An HTTPRoute rule
  # with no "matches" defaults to a "/" prefix match per the Gateway API
  # spec, the same default an Ingress with one "/" path rule gives.
  parentRefs:
    # Name of the Gateway this HTTPRoute attaches to. Required when
    # httpRoute.enabled is true.
    name: ""
    # Namespace the Gateway lives in. Required when httpRoute.enabled is
    # true: a Gateway is usually platform owned and lives in a different
    # namespace than this release, and Gateway API's own parentRefs
    # defaults an unset namespace to the HTTPRoute's own namespace, which
    # is normally wrong here. The Gateway's own allowedRoutes still decides
    # whether this reference is actually honoured.
    namespace: ""
    # Optional: the specific listener to attach to, when the Gateway
    # exposes more than one, for example separate HTTP and HTTPS
    # listeners.
    sectionName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # No CPU limit: serving a prerendered page and the SPA bundle is
    # bursty on a page load, not broken for being briefly busy. A memory
    # limit stays in place as a safety net against a genuine leak.
    memory: 128Mi

startupProbe:
  # Disabled by default: startup only loads the embedded frontend and
  # validates the configuration, neither of which is expected to be slow
  # enough to need one.
  enabled: false
  initialDelaySeconds: 0
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# Plain, non-secret configuration. See README.md's values table and the
# repository root README.md's Configuration section for what each one does.
config:
  listenAddr: ":8080"
  # govue's admin listener (ADMIN_ADDR): health, readiness and metrics,
  # served separately from listenAddr above; see service.adminPort and
  # templates/deployment.yaml's second container port and probes.
  adminListenAddr: ":8081"
  siteUrl: "https://ostendorf.tech"
  logLevel: "info"
  # Required once ingress.enabled is true: left empty behind this chart's
  # own Ingress, clientip.NewResolver attributes every request to the
  # ingress controller's pod IP, collapsing every rate limiter into one
  # shared bucket for the whole site instead of one per visitor.
  # templates/deployment.yaml rejects an install or template render that
  # leaves this empty while ingress.enabled is true. Set it to the ingress
  # controller's pod or Service CIDR; see README.md.
  trustedProxyCidrs: ""
  allowPlainHttp: false
  rateLimitBurst: 120
  rateLimitPer: "1m"
  challengeRateLimitBurst: 10
  challengeRateLimitPer: "20s"
  contactRateLimitBurst: 5
  contactRateLimitPer: "10m"
  # Bounds every contact mail this service sends in total, across every
  # client address, independent of the per-client contactRateLimitBurst
  # above: clientip groups IPv6 clients by /64, so a single routed /48 is
  # 65,536 independent per-client buckets, which leaves no ceiling on the
  # mail account itself. 50 an hour is well above anything one event
  # technology sole trader's contact form is ever expected to receive
  # legitimately. See internal/webapp and internal/config.
  mailRateLimitBurst: 50
  mailRateLimitPer: "1h"
  smtpAddr: "mail.ostendorf.cloud:587"
  contactTo: "simon@ostendorf.tech"
  contactFrom: "ostendorf.tech <no-reply@ostendorf.cloud>"
  # How often the website asks the feed service for the current post list;
  # see internal/config.DefaultFeedRefreshInterval and FEED_REFRESH_INTERVAL.
  # The feed service's own, independent sync interval against Meta is
  # feed.config.syncInterval below; this is only how often the website
  # re-reads the feed service's already-cached result.
  feedRefreshInterval: "5m"
  # Page views are reported to Umami by the server itself, never by a
  # script in the visitor's browser. Both empty count nothing; setting
  # only one of the two is refused at startup rather than half-enabling
  # the feature. umamiWebsiteId is the lowercase UUID Umami shows for the
  # website, and umamiUrl its own base URL, typically the in-cluster
  # Service.
  umamiUrl: ""
  umamiWebsiteId: ""

# This chart never creates a Secret from plaintext values (see README.md).
# Every secret-shaped setting is read from a Secret the installer already
# has, named here and referenced key by key, so a secret-manager operator
# that produces different key names is never forced into one shape.
existingSecret:
  # Required: name of the existing Secret carrying the keys below. Left
  # empty here because no default could ever point at something that
  # actually exists on the cluster; templates/deployment.yaml rejects an
  # install or template render that leaves this empty, instead of shipping
  # a Pod that crash-loops on a missing CSRF_KEY.
  name: ""
  # Required key: CSRF_KEY has no fallback, so a missing key in the
  # referenced Secret surfaces as a real Kubernetes error
  # (CreateContainerConfigError) instead of a silently empty value, and
  # the server refuses to start without one either way.
  csrfKeyKey: "CSRF_KEY"
  # Optional keys: left empty, the corresponding environment variable is
  # omitted entirely rather than wired to a key that may not exist. The
  # contact form answers "unavailable" for whichever of these is missing;
  # every other page still works.
  challengeKeyKey: ""
  # Set only while rotating challengeKeyKey: the previous CHALLENGE_KEY,
  # kept around so a proof of work challenge issued just before the
  # rotation still verifies. Remove it again once the rotation's own
  # challenge TTL (10 minutes) has safely passed. See AGENTS.md.
  challengeKeyPreviousKey: ""
  smtpUsernameKey: ""
  smtpPasswordKey: ""

# The feed service: a second, independent workload that reads the Instagram
# Impressionen feed from Meta and serves it to the website, with its own
# Deployment, Service and ServiceAccount.
feed:
  # Guards every object this workload renders: the Deployment, the Service,
  # the ServiceAccount and the NetworkPolicy. Disabled by default: without
  # OpenBao and a hand-written token already in place, an enabled feed pod
  # sits at 0/1 ready forever, which is otherwise the only thing a default
  # install of this chart would produce. The website works fully with the
  # feed disabled; it renders no Impressionen section, exactly its existing
  # behaviour for an unreachable or empty feed (see internal/feedclient in
  # AGENTS.md). The website's own FEED_SERVICE_URL follows this flag too
  # (see templates/deployment.yaml): unset while this is false. Enable this
  # only once feed.config.openBaoAddr and feed.config.openBaoRole actually
  # point at a real OpenBao installation and role; see README.md's "Feed
  # service" section.
  enabled: false

  # No upper bound here, unlike the website's own replicaCount: the feed
  # service keeps no per-pod session state, it only caches a read-only copy
  # of the feed resynced from Meta and OpenBao independently per pod, so more
  # than one replica, or two pods briefly coexisting during an ordinary
  # rolling update, is harmless. 0 pauses the workload the same way it does
  # for the website.
  replicaCount: 1

  image:
    # Different image name than the website's own (ghcr.io/ostendorf-cloud/
    # ostendorf.tech): this is a separate binary (cmd/feed), built from the
    # same root Dockerfile as a separate final stage ("docker build --target
    # feed") and published by its own job in .github/workflows/publish.yaml,
    # tagged from the same release as the website's own image.
    repository: ghcr.io/ostendorf-cloud/ostendorf.tech-feed
    # Defaults to .Chart.AppVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent

  serviceAccount:
    # Created so the feed service has its own identity to log in to OpenBao
    # with, through the Kubernetes auth method; see feed.config.openBaoRole
    # and templates/deployment-feed.yaml's projected volume. No RBAC is
    # created: this workload makes no Kubernetes API calls of its own.
    create: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  # Matches the Dockerfile's distroless "nonroot" base image, uid/gid 65532,
  # the same as the website's own podSecurityContext.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  # Same shape as the website's own securityContext.
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    # Also used as the container port and for the probes: must match the
    # port encoded in feed.config.listenAddr (default ":8081" for both),
    # matching internal/feedconfig.DefaultListenAddr. Unlike the website,
    # there is only one listener here: internal/feed.App.buildHandler serves
    # health, readiness and the API routes on this one port, so there is no
    # second, admin port to configure.
    port: 8081

  # Restricts this workload's own ingress and egress traffic at the cluster
  # level; see templates/networkpolicy.yaml. Defaults to true, since this
  # organisation's clusters enforce NetworkPolicy and issue #24's own plan
  # calls for enforcement by the chart rather than by convention. This
  # object does nothing at all on a cluster whose CNI does not enforce
  # NetworkPolicy, with no error or warning either way; confirm your CNI
  # actually enforces NetworkPolicy before relying on it. See README.md.
  networkPolicy:
    enabled: true
    # OpenBao/Vault's conventional API port. Kept as its own value rather
    # than parsed out of feed.config.openBaoAddr's URL; see
    # templates/networkpolicy.yaml's own comment for why. Keep this in sync
    # by hand with whatever port feed.config.openBaoAddr actually names, if
    # it ever differs from this default.
    openBaoPort: 8200
    # Scopes the DNS egress rule's destination, on top of the port
    # restriction alone. Both default to kube-dns's own conventional
    # namespace and pod label, which CoreDNS also carries on most clusters
    # for compatibility (kubeadm's default install included). Wrong on a
    # cluster whose DNS pods do not carry these labels: the feed pod then
    # cannot resolve any name at all, Meta's included, which looks identical
    # to a Meta outage from the outside rather than a policy error. Verify
    # your cluster's actual DNS pod labels, for example with
    # `kubectl get pods -n kube-system -l k8s-app=kube-dns --show-labels`,
    # before relying on the default; see README.md. A Service's own labels
    # do not bind the NetworkPolicy, which matches pods directly, and the
    # two can disagree. NodeLocal DNSCache is a second way this default
    # misses: on a cluster running it, the pod's resolver points at a
    # per-node pod labelled `k8s-app: node-local-dns`, not `kube-dns`.
    #
    # Helm merges a user's override into this default map key by key, not
    # key for key: an override under a key the default does not already use
    # is added alongside the default, not instead of it. `podSelector:
    # {app: coredns}` here would therefore render `app: coredns` AND
    # `k8s-app: kube-dns`, a selector that matches no pod carrying only one
    # of the two. Null the specific default key you mean to replace to drop
    # it, for example `podSelector: {k8s-app: null, app: coredns}`. Set both
    # namespaceSelector and podSelector to null entirely (not {}: Helm
    # merges a map default with an empty override instead of clearing it, so
    # {} here would silently keep kube-system/kube-dns) to fall back to the
    # port-only rule this chart shipped before, with no destination scoping
    # at all.
    dns:
      namespaceSelector:
        kubernetes.io/metadata.name: kube-system
      podSelector:
        k8s-app: kube-dns
    # Scopes the OpenBao egress rule's destination, on top of the port
    # restriction alone. Unlike dns above, OpenBao's address is always
    # explicitly configured (feed.config.openBaoAddr), but this chart does
    # not parse that URL to derive the scope: feed.config.openBaoAddr may
    # name an OpenBao installation outside the cluster entirely, which no
    # namespace or pod selector could ever describe, so the operator who
    # already set that address sets this too. The default below matches
    # this organisation's own namespace-per-topic convention (see
    # kubernetes-conventions): OpenBao's own namespace is named "openbao".
    # The same per-key merge applies here as for dns above: an override of
    # namespaceSelector under a key other than `kubernetes.io/metadata.name`
    # is added alongside that default key, not instead of it, so null that
    # key explicitly to replace it. Set namespaceSelector to null entirely
    # for the same port-only fallback as dns above, for the same reason:
    # null, not {}.
    openBao:
      namespaceSelector:
        kubernetes.io/metadata.name: openbao
      # Left as an empty object, not null: values.schema.json types this as
      # an object, and a literal null default (as opposed to a user's own
      # override to null, which Helm's own coalescing deletes outright
      # before schema validation ever sees it) fails that check. An empty
      # map is falsy in the template the same way null is, so this still
      # renders no podSelector on the OpenBao egress rule. Namespace scoping
      # alone is already a significant tightening over the previous, fully
      # open rule, and OpenBao deployments vary too much in their own pod
      # labels for one default to fit; add matchLabels here to scope
      # further.
      podSelector: {}

  # The projected ServiceAccount token used as the OpenBao login credential;
  # see feed.config.openBaoJwtFile and templates/deployment-feed.yaml.
  serviceAccountToken:
    # Optional: the audience the projected token is issued for. Left empty,
    # the Kubernetes API server's own default audience is used, which is
    # also what OpenBao's Kubernetes auth method expects when configured
    # with no explicit audience of its own.
    audience: ""
    # Kubernetes refreshes a projected token automatically once it is past
    # 80% of its own lifetime, well before this expires; internal/openbao
    # reads the file fresh on every login, so this only bounds how long a
    # single cached token can be used for, never how long the pod can run.
    expirationSeconds: 3600

  resources:
    requests:
      # Lower than the website's own defaults: this pod caches around 20
      # posts' worth of image bytes, nothing else.
      cpu: 10m
      memory: 32Mi
    limits:
      # No CPU limit: syncing with Meta and OpenBao is bursty on a sync
      # cycle, not broken for being briefly busy; same reasoning as the
      # website's own resources comment. A memory limit stays in place as a
      # safety net against a genuine leak.
      memory: 64Mi

  startupProbe:
    # Disabled by default: startup only logs in to OpenBao and runs one sync
    # cycle, neither of which is expected to be slow enough to need one.
    enabled: false
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 30

  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Plain, non-secret configuration; see internal/feedconfig's own comment
  # for why none of these ten is secret-shaped. The one actual secret, the
  # Meta access token, lives in OpenBao, never in a value here or in a
  # Kubernetes Secret.
  config:
    listenAddr: ":8081"
    logLevel: "info"
    # Required: the OpenBao address the feed service authenticates against.
    # Left empty here because no default could ever point at an OpenBao
    # installation that actually exists; templates/_helpers.tpl's
    # ostendorf-tech.feed.openBaoAddr rejects an install or template render
    # that leaves this empty, the same reasoning as existingSecret.name's
    # own comment above.
    openBaoAddr: ""
    openBaoAuthPath: "kubernetes"
    # Required: the OpenBao Kubernetes auth role the feed service logs in
    # as. Left empty for the same reason as openBaoAddr above: the role and
    # its policy are created once, by hand, in OpenBao itself, and no
    # default here could ever name one that actually exists.
    openBaoRole: ""
    # Path to the projected ServiceAccount token file used as the OpenBao
    # login credential. templates/deployment-feed.yaml mounts the projected
    # volume from feed.serviceAccountToken at exactly this path (its
    # directory becomes the volume mount, its filename the projected
    # source's own path), so this one value can never drift out of sync
    # with what is actually mounted.
    openBaoJwtFile: "/var/run/secrets/openbao/token"
    tokenPath: "instagram.com/api-tokens/data/simonostendorf.vtech"
    syncInterval: "1h"
    tokenRefreshAge: "7d"
    apiVersion: "v23.0"
    postCount: 20
