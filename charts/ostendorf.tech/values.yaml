# Default values for ostendorf-tech.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Must stay at 1 or drop to 0; never go above 1. internal/webapp/session.go
# keeps the anonymous session the CSRF protector relies on in govue's
# in-process session.MemoryStore. A second replica, or two pods briefly
# coexisting during an ordinary rolling update, can answer a visitor's GET
# on one pod and their contact form POST on another pod that never saw that
# session: requireSession then refuses that POST with 403, correctly from
# that pod's point of view but wrongly from the visitor's, since their
# session is real, just on the other pod. This breaks the contact form for
# real visitors; it is an availability problem, not a security hole.
# templates/deployment.yaml rejects any value above 1 at render time and
# runs the Deployment with strategy.type: Recreate, so a rollout never lets
# two pods coexist either. Raise this above 1 only once the webapp moves to
# a shared session store; see AGENTS.md.
#
# 0 is deliberately still allowed (values.schema.json's own minimum is 0):
# stopping the site entirely, for a maintenance window or to pause the
# deployment, is a legitimate, intentional use of replicaCount that the
# single-pod guard above was never meant to prevent; it guards against more
# than one pod existing, not against zero. Scaling back up from 0 is a
# normal start, not a rollout, so it raises no second-pod risk either.
replicaCount: 1

image:
  repository: ghcr.io/ostendorf-cloud/ostendorf.tech
  # Defaults to .Chart.AppVersion when left empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # No RBAC is created: this application makes no Kubernetes API calls of its own.
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Matches the Dockerfile's distroless "nonroot" base image, uid/gid 65532.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  # Also used as the container port and for the probes: must match the port
  # encoded in config.listenAddr (default ":8080" for both). This is the
  # only port the chart's own Ingress or HTTPRoute ever routes to.
  port: 8080
  # govue's admin listener: health, readiness and metrics, never routed by
  # this chart's own Ingress or HTTPRoute (templates/ingress.yaml and
  # templates/httproute.yaml only ever reference service.port above).
  # Reached only from inside the cluster, by a kubelet's probe or a
  # Prometheus ServiceMonitor/PodMonitor (not part of this chart). Must
  # match the port encoded in config.adminListenAddr (default ":8081" for
  # both).
  adminPort: 8081

# Ingress and httpRoute below are two ways to reach this chart's own Service
# externally, chosen by their own enabled flag. Mutually exclusive (see
# templates/deployment.yaml's own fail guard): an install never renders
# both for the same hostname. Both default to false, so a default install
# renders no external route at all until one of the two is chosen.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ostendorf.tech
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API alternative to ingress above; see that block's own comment for
# the mutual-exclusion rule.
#
# The HTTPRoute and Gateway kinds are Gateway API CRDs. This chart never
# ships them (see kubernetes-conventions) and never creates the Gateway
# itself: both the CRDs and a running Gateway with a listener that allows
# this release's namespace are prerequisites, provisioned once per cluster,
# not by this chart.
httpRoute:
  enabled: false
  # Hostnames this HTTPRoute matches, mirroring ingress.hosts' host field.
  # A Gateway listener's own hostname (and allowedRoutes) still decides
  # whether traffic for one of these actually reaches this HTTPRoute; see
  # kubernetes-conventions.
  hostnames: []
  annotations: {}
  # Routing is fixed to this chart's own Service on service.port: no
  # values-driven way to add a second backend or a per-path rule, the same
  # single-backend shape ingress.hosts already assumes. An HTTPRoute rule
  # with no "matches" defaults to a "/" prefix match per the Gateway API
  # spec, the same default an Ingress with one "/" path rule gives.
  parentRefs:
    # Name of the Gateway this HTTPRoute attaches to. Required when
    # httpRoute.enabled is true.
    name: ""
    # Namespace the Gateway lives in. Required when httpRoute.enabled is
    # true: a Gateway is usually platform owned and lives in a different
    # namespace than this release, and Gateway API's own parentRefs
    # defaults an unset namespace to the HTTPRoute's own namespace, which
    # is normally wrong here. The Gateway's own allowedRoutes still decides
    # whether this reference is actually honoured.
    namespace: ""
    # Optional: the specific listener to attach to, when the Gateway
    # exposes more than one, for example separate HTTP and HTTPS
    # listeners.
    sectionName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # No CPU limit: serving a prerendered page and the SPA bundle is
    # bursty on a page load, not broken for being briefly busy. A memory
    # limit stays in place as a safety net against a genuine leak.
    memory: 128Mi

startupProbe:
  # Disabled by default: startup only loads the embedded frontend and
  # validates the configuration, neither of which is expected to be slow
  # enough to need one.
  enabled: false
  initialDelaySeconds: 0
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# Plain, non-secret configuration. See README.md's values table and the
# repository root README.md's Configuration section for what each one does.
config:
  listenAddr: ":8080"
  # govue's admin listener (ADMIN_ADDR): health, readiness and metrics,
  # served separately from listenAddr above; see service.adminPort and
  # templates/deployment.yaml's second container port and probes.
  adminListenAddr: ":8081"
  siteUrl: "https://ostendorf.tech"
  logLevel: "info"
  # Required once ingress.enabled is true: left empty behind this chart's
  # own Ingress, clientip.NewResolver attributes every request to the
  # ingress controller's pod IP, collapsing every rate limiter into one
  # shared bucket for the whole site instead of one per visitor.
  # templates/deployment.yaml rejects an install or template render that
  # leaves this empty while ingress.enabled is true. Set it to the ingress
  # controller's pod or Service CIDR; see README.md.
  trustedProxyCidrs: ""
  allowPlainHttp: false
  rateLimitBurst: 120
  rateLimitPer: "1m"
  challengeRateLimitBurst: 10
  challengeRateLimitPer: "20s"
  contactRateLimitBurst: 5
  contactRateLimitPer: "10m"
  # Bounds every contact mail this service sends in total, across every
  # client address, independent of the per-client contactRateLimitBurst
  # above: clientip groups IPv6 clients by /64, so a single routed /48 is
  # 65,536 independent per-client buckets, which leaves no ceiling on the
  # mail account itself. 50 an hour is well above anything one event
  # technology sole trader's contact form is ever expected to receive
  # legitimately. See internal/webapp and internal/config.
  mailRateLimitBurst: 50
  mailRateLimitPer: "1h"
  smtpAddr: "mail.ostendorf.cloud:587"
  contactTo: "simon@ostendorf.tech"
  contactFrom: "ostendorf.tech <no-reply@ostendorf.cloud>"
  # The home page's Impressionen section. It renders only while the server
  # actually holds posts, which needs existingSecret.instagramTokenKey
  # below; the settings here only shape how that feed is loaded and are
  # inert without a token.
  instagramApiVersion: "v23.0"
  instagramPostCount: 20
  instagramRefreshInterval: "1h"
  # Meta refuses to refresh a token younger than 24 hours, and a long
  # lived token expires after 60 days, which bounds this at both ends. A
  # refreshed token lives in the pod's memory only: this application has
  # no secret manager client, so a restart falls back to the Secret's own
  # value, which still has to be rotated before it expires.
  instagramTokenRefreshAge: "7d"
  # Page views are reported to Umami by the server itself, never by a
  # script in the visitor's browser. Both empty count nothing; setting
  # only one of the two is refused at startup rather than half-enabling
  # the feature. umamiWebsiteId is the lowercase UUID Umami shows for the
  # website, and umamiUrl its own base URL, typically the in-cluster
  # Service.
  umamiUrl: ""
  umamiWebsiteId: ""

# This chart never creates a Secret from plaintext values (see README.md).
# Every secret-shaped setting is read from a Secret the installer already
# has, named here and referenced key by key, so a secret-manager operator
# that produces different key names is never forced into one shape.
existingSecret:
  # Required: name of the existing Secret carrying the keys below. Left
  # empty here because no default could ever point at something that
  # actually exists on the cluster; templates/deployment.yaml rejects an
  # install or template render that leaves this empty, instead of shipping
  # a Pod that crash-loops on a missing CSRF_KEY.
  name: ""
  # Required key: CSRF_KEY has no fallback, so a missing key in the
  # referenced Secret surfaces as a real Kubernetes error
  # (CreateContainerConfigError) instead of a silently empty value, and
  # the server refuses to start without one either way.
  csrfKeyKey: "CSRF_KEY"
  # Optional keys: left empty, the corresponding environment variable is
  # omitted entirely rather than wired to a key that may not exist. The
  # contact form answers "unavailable" for whichever of these is missing;
  # every other page still works.
  challengeKeyKey: ""
  # Set only while rotating challengeKeyKey: the previous CHALLENGE_KEY,
  # kept around so a proof of work challenge issued just before the
  # rotation still verifies. Remove it again once the rotation's own
  # challenge TTL (10 minutes) has safely passed. See AGENTS.md.
  challengeKeyPreviousKey: ""
  smtpUsernameKey: ""
  smtpPasswordKey: ""
  # The Instagram access token. Left empty, the Impressionen section is
  # switched off entirely: no feed is loaded and the page renders no
  # section at all, with every other part of the site unaffected.
  instagramTokenKey: ""
