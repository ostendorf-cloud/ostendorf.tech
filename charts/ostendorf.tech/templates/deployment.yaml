# The API: the contact form and the feed proxy (cmd/api). The file keeps its name
# from before the split into frontend, API and feed; the chart's top level values
# (replicaCount, image, resources, probes, config, existingSecret) are this
# workload's. The static pages are the frontend's own Deployment, see
# templates/deployment-frontend.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ostendorf-tech.api.fullname" . }}
  labels:
    {{- include "ostendorf-tech.api.labels" . | nindent 4 }}
spec:
  {{/*
  Ingress and httpRoute are mutually exclusive: both pick an external route
  for the same hostname, and only one may be the deployment's actual front
  door. This guard lives here, not duplicated into templates/ingress.yaml
  and templates/httproute.yaml, because templates/deployment.yaml always
  renders regardless of which routing flag is set (or neither), so a single
  check here fires exactly once, deterministically, however Helm orders
  template execution across files - unlike a guard split across the two
  routing templates themselves, where Helm's own template engine aborts the
  whole render at the first of the two to fail and never reaches the second,
  making only one of two duplicated guards ever observable. This is about
  the API's own replicaCount and the routing flags only: the other
  Deployments in templates/deployment-frontend.yaml and
  templates/deployment-feed.yaml must not duplicate these guards, since they
  are unrelated to those workloads.
  */}}
  {{- if and .Values.ingress.enabled .Values.httpRoute.enabled }}
  {{ fail "ingress.enabled and httpRoute.enabled cannot both be true: pick one external route and turn the other off." }}
  {{- end }}
  {{- if gt (.Values.replicaCount | int) 1 }}
  {{ fail "replicaCount must stay at 1: govue's contact form keeps its rate limits, its global mail ceiling and its proof of work replay set in the memory of one process. Every replica has its own, so two replicas double every budget, the mail ceiling included, and a solved challenge can be used once per replica. Raise replicaCount only after those move to a shared store; see AGENTS.md." }}
  {{- end }}
  {{/*
  The Secret carries CHALLENGE_KEY and the SMTP credentials. Without them the
  contact form answers 503, so an install without a Secret is a mistake:
  the name is required even while every key below is left unset.
  */}}
  {{- $_ := include "ostendorf-tech.existingSecretName" . }}
  {{- if and .Values.existingSecret.challengeKeyPreviousKey (not .Values.existingSecret.challengeKeyKey) }}
  {{ fail "existingSecret.challengeKeyPreviousKey needs existingSecret.challengeKeyKey: the previous key only verifies during a rotation, and the API refuses to start with it alone, since a retired key would then issue challenges again." }}
  {{- end }}
  {{- if and .Values.ingress.enabled (not .Values.config.trustedProxies) }}
  {{ fail "config.trustedProxies must be set when ingress.enabled is true: clientip.NewResolver with no trusted prefixes attributes every request to its TCP peer, which behind this chart's own Ingress is the ingress controller's pod IP. Every rate limiter then keys on that one address, collapsing the whole site's traffic into one shared bucket (roughly 20 page loads per minute site-wide, and five contact submissions blocking the form for every visitor for ContactRateLimitPer). Set it to the ingress controller's pod or Service CIDR; see README.md." }}
  {{- end }}
  {{- if and .Values.config.allowPlainHttp (hasPrefix "https://" (.Values.config.siteUrl | toString | trim | lower)) }}
  {{ fail "config.allowPlainHttp must not be true when config.siteUrl is https: it turns HSTS off, which a site served over https must keep. Set it only for a plain http development run, or serve the site over plain http." }}
  {{- end }}
  {{- include "ostendorf-tech.checkGoMemLimit" (list "goMemLimit" .Values.goMemLimit "resources.limits.memory" (dig "limits" "memory" "" (.Values.resources | default dict))) }}
  replicas: {{ .Values.replicaCount }}
  # Recreate, not the default RollingUpdate: the contact form's per client
  # limits, its global mail ceiling and its proof of work replay set live in
  # the memory of one process. A rolling update's maxSurge would briefly run
  # two pods, each with its own copy, which is exactly what the replicaCount
  # guard above exists to prevent. This holds the single-pod invariant during
  # a rollout too, not only at a fixed replicaCount.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ostendorf-tech.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ostendorf-tech.api.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ostendorf-tech.api.serviceAccountName" . }}
      # This application makes no Kubernetes API calls of its own; see
      # templates/serviceaccount.yaml and values.yaml. Set on the pod too,
      # not only the ServiceAccount, since the pod spec's own value would
      # otherwise win if it were ever left unset here.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
              protocol: TCP
          env:
            {{- with .Values.goMemLimit }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            - name: LISTEN_ADDR
              value: {{ .Values.config.listenAddr | quote }}
            - name: ADMIN_ADDR
              value: {{ .Values.config.adminListenAddr | quote }}
            - name: SITE_URL
              value: {{ .Values.config.siteUrl | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- if .Values.config.trustedProxies }}
            - name: TRUSTED_PROXIES
              value: {{ .Values.config.trustedProxies | quote }}
            {{- end }}
            - name: ALLOW_PLAIN_HTTP
              value: {{ .Values.config.allowPlainHttp | quote }}
            - name: RATE_LIMIT_BURST
              value: {{ .Values.config.rateLimitBurst | quote }}
            - name: RATE_LIMIT_PER
              value: {{ .Values.config.rateLimitPer | quote }}
            - name: CHALLENGE_RATE_LIMIT_BURST
              value: {{ .Values.config.challengeRateLimitBurst | quote }}
            - name: CHALLENGE_RATE_LIMIT_PER
              value: {{ .Values.config.challengeRateLimitPer | quote }}
            - name: CONTACT_RATE_LIMIT_BURST
              value: {{ .Values.config.contactRateLimitBurst | quote }}
            - name: CONTACT_RATE_LIMIT_PER
              value: {{ .Values.config.contactRateLimitPer | quote }}
            - name: MAIL_RATE_LIMIT_BURST
              value: {{ .Values.config.mailRateLimitBurst | quote }}
            - name: MAIL_RATE_LIMIT_PER
              value: {{ .Values.config.mailRateLimitPer | quote }}
            {{- if .Values.config.smtpHost }}
            - name: SMTP_HOST
              value: {{ .Values.config.smtpHost | quote }}
            - name: SMTP_PORT
              value: {{ .Values.config.smtpPort | quote }}
            {{- end }}
            - name: CONTACT_TO
              value: {{ .Values.config.contactTo | quote }}
            - name: CONTACT_FROM
              value: {{ .Values.config.contactFrom | quote }}
            - name: FEED_REFRESH_INTERVAL
              value: {{ .Values.config.feedRefreshInterval | quote }}
            # Always computed from the feed Service's own name and port, never
            # values-driven: this value must always resolve to this exact
            # release's own feed Service, in the same namespace, so there is
            # no legitimate reason for an installer to point it elsewhere.
            # Omitted entirely while feed.enabled is false: internal/config
            # already treats an unset FEED_SERVICE_URL as "render no
            # Impressionen section", so there is nothing else to wire for a
            # disabled feed.
            {{- if .Values.feed.enabled }}
            - name: FEED_SERVICE_URL
              value: {{ printf "http://%s:%v" (include "ostendorf-tech.feed.fullname" .) .Values.feed.service.port | quote }}
            {{- end }}
            {{- /* No UMAMI_* here: the API counts no page views, the
                   frontend serves the pages and counts them. */}}
            {{- /* The challenge keys and the SMTP credentials are files from
                   Secret volumes, read through their _FILE twins, so no
                   secret value is in the container's environment. */}}
            {{- if .Values.existingSecret.challengeKeyKey }}
            - name: CHALLENGE_KEY_FILE
              value: /run/secrets/challenge/current
            {{- end }}
            {{- if .Values.existingSecret.challengeKeyPreviousKey }}
            - name: CHALLENGE_KEY_PREVIOUS_FILE
              value: /run/secrets/challenge/previous
            {{- end }}
            {{- if .Values.existingSecret.smtpUsernameKey }}
            - name: SMTP_USERNAME_FILE
              value: /run/secrets/smtp/username
            {{- end }}
            {{- if .Values.existingSecret.smtpPasswordKey }}
            - name: SMTP_PASSWORD_FILE
              value: /run/secrets/smtp/password
            {{- end }}
          {{- if or .Values.existingSecret.challengeKeyKey .Values.existingSecret.smtpUsernameKey .Values.existingSecret.smtpPasswordKey }}
          volumeMounts:
            {{- if .Values.existingSecret.challengeKeyKey }}
            - name: challenge-keys
              mountPath: /run/secrets/challenge
              readOnly: true
            {{- end }}
            {{- if or .Values.existingSecret.smtpUsernameKey .Values.existingSecret.smtpPasswordKey }}
            - name: smtp-credentials
              mountPath: /run/secrets/smtp
              readOnly: true
            {{- end }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.existingSecret.challengeKeyKey .Values.existingSecret.smtpUsernameKey .Values.existingSecret.smtpPasswordKey }}
      volumes:
        {{- if .Values.existingSecret.challengeKeyKey }}
        - name: challenge-keys
          secret:
            secretName: {{ include "ostendorf-tech.existingSecretName" . }}
            # Readable by the pod's fsGroup only, the group the process runs in.
            defaultMode: 0440
            items:
              - key: {{ .Values.existingSecret.challengeKeyKey }}
                path: current
              {{- with .Values.existingSecret.challengeKeyPreviousKey }}
              - key: {{ . }}
                path: previous
              {{- end }}
        {{- end }}
        {{- if or .Values.existingSecret.smtpUsernameKey .Values.existingSecret.smtpPasswordKey }}
        - name: smtp-credentials
          secret:
            secretName: {{ include "ostendorf-tech.existingSecretName" . }}
            # Readable by the pod's fsGroup only, the group the process runs in.
            defaultMode: 0440
            items:
              {{- with .Values.existingSecret.smtpUsernameKey }}
              - key: {{ . }}
                path: username
              {{- end }}
              {{- with .Values.existingSecret.smtpPasswordKey }}
              - key: {{ . }}
                path: password
              {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
