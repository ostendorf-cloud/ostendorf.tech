apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ostendorf-tech.fullname" . }}
  labels:
    {{- include "ostendorf-tech.labels" . | nindent 4 }}
spec:
  {{/*
  Ingress and httpRoute are mutually exclusive: both pick an external route
  for the same hostname, and only one may be the deployment's actual front
  door. This guard lives here, not duplicated into templates/ingress.yaml
  and templates/httproute.yaml, because templates/deployment.yaml always
  renders regardless of which routing flag is set (or neither), so a single
  check here fires exactly once, deterministically, however Helm orders
  template execution across files - unlike a guard split across the two
  routing templates themselves, where Helm's own template engine aborts the
  whole render at the first of the two to fail and never reaches the second,
  making only one of two duplicated guards ever observable. This is about
  the website's own ingress/httpRoute/replicaCount only: the second,
  independent Deployment in templates/deployment-feed.yaml must not
  duplicate these guards, since they are unrelated to the feed workload.
  */}}
  {{- if and .Values.ingress.enabled .Values.httpRoute.enabled }}
  {{ fail "ingress.enabled and httpRoute.enabled cannot both be true: pick one external route and turn the other off." }}
  {{- end }}
  {{- if gt (.Values.replicaCount | int) 1 }}
  {{ fail "replicaCount must stay at 1: internal/webapp/session.go keeps the anonymous session, and the CSRF token derived from it, in govue's in-process session.MemoryStore. A second replica can answer a visitor's GET on one pod and their contact form POST on another pod that never saw that session: requireSession then refuses that POST with 403, correctly from that pod's point of view but wrongly from the visitor's, since their session is real, just on the other pod. This breaks the contact form for real visitors; it is an availability problem, not a security hole. Raise replicaCount only after moving to a shared session store; see AGENTS.md." }}
  {{- end }}
  {{- if and .Values.ingress.enabled (not .Values.config.trustedProxyCidrs) }}
  {{ fail "config.trustedProxyCidrs must be set when ingress.enabled is true: clientip.NewResolver with no trusted prefixes attributes every request to its TCP peer, which behind this chart's own Ingress is the ingress controller's pod IP. Every rate limiter then keys on that one address, collapsing the whole site's traffic into one shared bucket (roughly 20 page loads per minute site-wide, and five contact submissions blocking the form for every visitor for ContactRateLimitPer). Set it to the ingress controller's pod or Service CIDR; see README.md." }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  # Recreate, not the default RollingUpdate: a rolling update's maxSurge
  # would otherwise briefly run two pods, which is exactly the "two pods, two
  # sessions" situation the replicaCount guard above exists to prevent. This
  # holds the single-pod invariant during a rollout too, not only at a fixed
  # replicaCount.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ostendorf-tech.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ostendorf-tech.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ostendorf-tech.serviceAccountName" . }}
      # This application makes no Kubernetes API calls of its own; see
      # templates/serviceaccount.yaml and values.yaml. Set on the pod too,
      # not only the ServiceAccount, since the pod spec's own value would
      # otherwise win if it were ever left unset here.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: {{ .Values.config.listenAddr | quote }}
            - name: ADMIN_ADDR
              value: {{ .Values.config.adminListenAddr | quote }}
            - name: SITE_URL
              value: {{ .Values.config.siteUrl | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- if .Values.config.trustedProxyCidrs }}
            - name: TRUSTED_PROXY_CIDRS
              value: {{ .Values.config.trustedProxyCidrs | quote }}
            {{- end }}
            - name: ALLOW_PLAIN_HTTP
              value: {{ .Values.config.allowPlainHttp | quote }}
            - name: RATE_LIMIT_BURST
              value: {{ .Values.config.rateLimitBurst | quote }}
            - name: RATE_LIMIT_PER
              value: {{ .Values.config.rateLimitPer | quote }}
            - name: CHALLENGE_RATE_LIMIT_BURST
              value: {{ .Values.config.challengeRateLimitBurst | quote }}
            - name: CHALLENGE_RATE_LIMIT_PER
              value: {{ .Values.config.challengeRateLimitPer | quote }}
            - name: CONTACT_RATE_LIMIT_BURST
              value: {{ .Values.config.contactRateLimitBurst | quote }}
            - name: CONTACT_RATE_LIMIT_PER
              value: {{ .Values.config.contactRateLimitPer | quote }}
            - name: MAIL_RATE_LIMIT_BURST
              value: {{ .Values.config.mailRateLimitBurst | quote }}
            - name: MAIL_RATE_LIMIT_PER
              value: {{ .Values.config.mailRateLimitPer | quote }}
            - name: SMTP_ADDR
              value: {{ .Values.config.smtpAddr | quote }}
            - name: CONTACT_TO
              value: {{ .Values.config.contactTo | quote }}
            - name: CONTACT_FROM
              value: {{ .Values.config.contactFrom | quote }}
            - name: FEED_REFRESH_INTERVAL
              value: {{ .Values.config.feedRefreshInterval | quote }}
            # Always computed from the feed Service's own name and port, never
            # values-driven: this value must always resolve to this exact
            # release's own feed Service, in the same namespace, so there is
            # no legitimate reason for an installer to point it elsewhere.
            # Omitted entirely while feed.enabled is false: internal/config
            # already treats an unset FEED_SERVICE_URL as "render no
            # Impressionen section", so there is nothing else to wire for a
            # disabled feed.
            {{- if .Values.feed.enabled }}
            - name: FEED_SERVICE_URL
              value: {{ printf "http://%s:%v" (include "ostendorf-tech.feed.fullname" .) .Values.feed.service.port | quote }}
            {{- end }}
            {{- if .Values.config.umamiUrl }}
            - name: UMAMI_URL
              value: {{ .Values.config.umamiUrl | quote }}
            {{- end }}
            {{- if .Values.config.umamiWebsiteId }}
            - name: UMAMI_WEBSITE_ID
              value: {{ .Values.config.umamiWebsiteId | quote }}
            {{- end }}
            - name: CSRF_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ostendorf-tech.existingSecretName" . }}
                  key: {{ .Values.existingSecret.csrfKeyKey }}
            {{- if .Values.existingSecret.challengeKeyKey }}
            - name: CHALLENGE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ostendorf-tech.existingSecretName" . }}
                  key: {{ .Values.existingSecret.challengeKeyKey }}
            {{- end }}
            {{- if .Values.existingSecret.challengeKeyPreviousKey }}
            - name: CHALLENGE_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "ostendorf-tech.existingSecretName" . }}
                  key: {{ .Values.existingSecret.challengeKeyPreviousKey }}
            {{- end }}
            {{- if .Values.existingSecret.smtpUsernameKey }}
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "ostendorf-tech.existingSecretName" . }}
                  key: {{ .Values.existingSecret.smtpUsernameKey }}
            {{- end }}
            {{- if .Values.existingSecret.smtpPasswordKey }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ostendorf-tech.existingSecretName" . }}
                  key: {{ .Values.existingSecret.smtpPasswordKey }}
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
