{{/*
The ingress/httpRoute mutual-exclusion guard lives in templates/deployment.yaml,
which always renders: see that file for why it is not duplicated here.
*/}}
{{- if .Values.httpRoute.enabled -}}
{{- if not .Values.httpRoute.parentRefs.name -}}
{{ fail "httpRoute.parentRefs.name is required when httpRoute.enabled is true" }}
{{- end -}}
{{- if not .Values.httpRoute.parentRefs.namespace -}}
{{ fail "httpRoute.parentRefs.namespace is required when httpRoute.enabled is true: the Gateway this HTTPRoute attaches to usually lives in a different namespace than this release" }}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ostendorf-tech.fullname" . }}
  labels:
    {{- include "ostendorf-tech.frontend.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentRefs.name }}
      namespace: {{ .Values.httpRoute.parentRefs.namespace }}
      {{- with .Values.httpRoute.parentRefs.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # The routing is fixed, not values-driven: /api is the API's, every other
  # path is the frontend's. The Gateway API picks the longest matching prefix,
  # so /api wins over / whatever the order. Only the http ports are ever
  # routed, never an admin port: an HTTPRoute that reached an admin listener
  # would undo the split that moved /metrics and the probes off the public
  # port; see values.yaml's own comment.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "ostendorf-tech.api.fullname" . }}
          port: {{ .Values.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "ostendorf-tech.frontend.fullname" . }}
          port: {{ .Values.frontend.service.port }}
{{- end -}}
