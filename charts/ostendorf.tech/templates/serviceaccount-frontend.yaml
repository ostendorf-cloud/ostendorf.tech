{{- if .Values.frontend.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ostendorf-tech.frontend.serviceAccountName" . }}
  labels:
    {{- include "ostendorf-tech.frontend.labels" . | nindent 4 }}
  {{- with .Values.frontend.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The frontend makes no Kubernetes API calls of its own and holds no secret; a
# token mounted into a public, internet-facing pod with no use for it is a
# token that cost nothing to deny.
automountServiceAccountToken: false
{{- end -}}
