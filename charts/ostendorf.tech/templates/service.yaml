# The API's Service (the file keeps its name from before the split).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ostendorf-tech.api.fullname" . }}
  labels:
    {{- include "ostendorf-tech.api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.adminPort }}
      targetPort: admin
      protocol: TCP
      name: admin
  selector:
    {{- include "ostendorf-tech.api.selectorLabels" . | nindent 4 }}
