{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ostendorf-tech.serviceAccountName" . }}
  labels:
    {{- include "ostendorf-tech.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# This application makes no Kubernetes API calls of its own (see
# values.yaml); a token mounted into a public, internet-facing pod with no
# use for it is a token that cost nothing to deny.
automountServiceAccountToken: false
{{- end -}}
