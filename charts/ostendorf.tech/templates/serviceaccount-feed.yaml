{{- if .Values.feed.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ostendorf-tech.feed.serviceAccountName" . }}
  labels:
    {{- include "ostendorf-tech.feed.labels" . | nindent 4 }}
  {{- with .Values.feed.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# This token is never auto-mounted: the feed service makes no Kubernetes API
# calls of its own, and it authenticates to OpenBao with the separately
# projected token in templates/deployment-feed.yaml instead, which already
# covers the OpenBao login need.
automountServiceAccountToken: false
{{- end -}}
