{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ostendorf-tech.fullname" . }}
  labels:
    {{- include "ostendorf-tech.release.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # The routing is fixed, not values-driven: /api is the API's, every
          # other path is the frontend's. An Ingress controller picks the
          # longest matching prefix, so /api wins over / whatever the order.
          # Only the http ports are ever routed, never an admin port.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "ostendorf-tech.api.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ostendorf-tech.frontend.fullname" $ }}
                port:
                  number: {{ $.Values.frontend.service.port }}
    {{- end }}
{{- end -}}
