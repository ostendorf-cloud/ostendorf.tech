{{- if .Values.networkPolicy.enabled -}}
{{- $np := .Values.networkPolicy -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ostendorf-tech.api.fullname" . }}
  labels:
    {{- include "ostendorf-tech.api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ostendorf-tech.api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The http port from the ingress controller (or Gateway) only, named by
    # networkPolicy.ingressController, which is required: no default could fit
    # every cluster. The Ingress routes /api here.
    #
    # No rule admits kubelet probe traffic, and none is needed: per the
    # Kubernetes documentation
    # (https://kubernetes.io/docs/concepts/services-networking/network-policies/),
    # the exception under ipBlock states "traffic to and from the node where a
    # Pod is running is always allowed, regardless of the IP address of the Pod
    # or the node". There is no conformance suite enforcing this for a
    # podSelector-based default-deny policy such as this one, but it holds in
    # practice on the common CNIs this organisation runs, so a kubelet
    # liveness/readiness probe, which originates from the node, needs no
    # ingress rule of its own here.
    - from:
        - {{- include "ostendorf-tech.networkPolicy.ingressControllerPeer" (list $np "") | nindent 10 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- if or ($np.metrics).namespaceSelector ($np.metrics).podSelector }}
    # The admin port (health, readiness, metrics) from the metrics scraper
    # only, named by networkPolicy.metrics. Left empty, no rule exists and
    # nothing but the node's own probes reaches the admin port.
    - from:
        - {{- include "ostendorf-tech.networkPolicy.peer" (dict "namespaceSelector" $np.metrics.namespaceSelector "podSelector" $np.metrics.podSelector) | nindent 10 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.adminPort }}
    {{- end }}
  egress:
    # DNS, scoped like the feed's own DNS rule; see networkPolicy.dns in
    # values.yaml.
    {{- include "ostendorf-tech.networkPolicy.dnsRule" $np | nindent 4 }}
    {{- if .Values.config.smtpHost }}
    # The SMTP submission server of the contact form, on config.smtpPort. Its
    # destination is networkPolicy.smtp.cidr, required while config.smtpHost
    # is set: a mail server outside the cluster has no selector, and this
    # chart cannot resolve a host name into addresses.
    {{- if not ($np.smtp).cidr }}
    {{ fail "networkPolicy.smtp.cidr is required when networkPolicy.enabled and config.smtpHost are set: the contact form's mail would be dropped without an egress rule for the SMTP server. Set it to the CIDR of config.smtpHost." }}
    {{- end }}
    - ports:
        - protocol: TCP
          port: {{ .Values.config.smtpPort }}
      to:
        - ipBlock:
            cidr: {{ $np.smtp.cidr | quote }}
    {{- end }}
    {{- if .Values.feed.enabled }}
    # The feed service's pods, on the feed port: FEED_SERVICE_URL.
    - ports:
        - protocol: TCP
          port: {{ .Values.feed.service.port }}
      to:
        - podSelector:
            matchLabels:
              {{- include "ostendorf-tech.feed.selectorLabels" . | nindent 14 }}
    {{- end }}
{{- end -}}
