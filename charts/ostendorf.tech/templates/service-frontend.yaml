apiVersion: v1
kind: Service
metadata:
  name: {{ include "ostendorf-tech.frontend.fullname" . }}
  labels:
    {{- include "ostendorf-tech.frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.frontend.service.adminPort }}
      targetPort: admin
      protocol: TCP
      name: admin
  selector:
    {{- include "ostendorf-tech.frontend.selectorLabels" . | nindent 4 }}
