{{- if and .Values.feed.enabled .Values.feed.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ostendorf-tech.feed.fullname" . }}
  labels:
    {{- include "ostendorf-tech.feed.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ostendorf-tech.feed.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the website's own pods may reach the feed service's API. No
    # namespaceSelector: per the NetworkPolicy spec, omitting it means "pods in
    # this NetworkPolicy's own namespace", correct here since the website and
    # the feed service share one namespace.
    #
    # No rule admits kubelet probe traffic, and none is needed: per the
    # Kubernetes documentation
    # (https://kubernetes.io/docs/concepts/services-networking/network-policies/),
    # the exception under ipBlock states "traffic to and from the node where a
    # Pod is running is always allowed, regardless of the IP address of the Pod
    # or the node". There is no conformance suite enforcing this for a
    # podSelector-based default-deny policy such as this one, but it holds in
    # practice on the common CNIs this organisation runs, so a kubelet
    # liveness/readiness probe, which originates from the node, needs no
    # ingress rule of its own here.
    - from:
        - podSelector:
            matchLabels:
              {{- include "ostendorf-tech.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.feed.service.port }}
  egress:
    # Of the three rules below, DNS and OpenBao are scoped by destination as
    # well as by port, through feed.networkPolicy.dns and
    # feed.networkPolicy.openBao. Meta's own rule is scoped by port only,
    # deliberately: said here once rather than left for a reader to assume
    # from the shape of the other two. A policy that scopes two rules while
    # reading as if it scopes all three is worse than one that says plainly
    # which rule still admits any destination.
    #
    # DNS. feed.networkPolicy.dns scopes this rule's destination, on top of
    # the port restriction below. Restricting only the port used to be the
    # whole rule, because the cluster's DNS Service's own namespace and pod
    # labels are not something this chart can know in advance across every
    # cluster it might be installed on, and guessing wrong would fail
    # silently at runtime, indistinguishable from a Meta outage, rather than
    # at render time. feed.networkPolicy.dns's own default narrows this to
    # the common case instead of leaving it open; see README.md for what
    # breaks if that default does not match your cluster, and that value's
    # own comment for the port-only fallback.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
      {{- $dnsPeer := dict }}
      {{- with .Values.feed.networkPolicy.dns.namespaceSelector }}
      {{- $_ := set $dnsPeer "namespaceSelector" (dict "matchLabels" .) }}
      {{- end }}
      {{- with .Values.feed.networkPolicy.dns.podSelector }}
      {{- $_ := set $dnsPeer "podSelector" (dict "matchLabels" .) }}
      {{- end }}
      {{- if $dnsPeer }}
      to:
        {{- list $dnsPeer | toYaml | nindent 8 }}
      {{- end }}
    # OpenBao. feed.networkPolicy.openBao scopes this rule's destination, on
    # top of the port restriction below. feed.networkPolicy.openBaoPort is
    # kept as its own explicit value, rather than parsed out of
    # feed.config.openBaoAddr's URL, because Helm's templating has no clean
    # way to read a URL's port (sprig's urlParse returns host and hostname,
    # not a separate port field); the destination scope below is kept
    # explicit for a related but distinct reason: feed.config.openBaoAddr may
    # name an OpenBao installation outside this cluster entirely, which no
    # namespace or pod selector could ever describe, so deriving one from
    # that URL would only replace one guess with another. A value that must
    # be kept in sync by hand, with a documented, named default, is clearer
    # here than URL-parsing logic would be either way.
    - ports:
        - protocol: TCP
          port: {{ .Values.feed.networkPolicy.openBaoPort }}
      {{- $openBaoPeer := dict }}
      {{- with .Values.feed.networkPolicy.openBao.namespaceSelector }}
      {{- $_ := set $openBaoPeer "namespaceSelector" (dict "matchLabels" .) }}
      {{- end }}
      {{- with .Values.feed.networkPolicy.openBao.podSelector }}
      {{- $_ := set $openBaoPeer "podSelector" (dict "matchLabels" .) }}
      {{- end }}
      {{- if $openBaoPeer }}
      to:
        {{- list $openBaoPeer | toYaml | nindent 8 }}
      {{- end }}
    # Meta's Graph API over HTTPS. No "to", deliberately and not merely
    # unfinished: Meta serves this from a CDN with no fixed, documentable IP
    # range, so there is no destination this rule could name that would not
    # go stale. This is the one rule of the three that admits any
    # destination on its port; see README.md.
    - ports:
        - protocol: TCP
          port: 443
{{- end -}}
