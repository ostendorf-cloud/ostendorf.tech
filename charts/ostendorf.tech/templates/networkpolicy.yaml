{{- if .Values.feed.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ostendorf-tech.feed.fullname" . }}
  labels:
    {{- include "ostendorf-tech.feed.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ostendorf-tech.feed.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the website's own pods may reach the feed service's API. No
    # namespaceSelector: per the NetworkPolicy spec, omitting it means "pods in
    # this NetworkPolicy's own namespace", correct here since the website and
    # the feed service share one namespace.
    #
    # No rule admits kubelet probe traffic, and none is needed: per the
    # Kubernetes documentation
    # (https://kubernetes.io/docs/concepts/services-networking/network-policies/),
    # the exception under ipBlock states "traffic to and from the node where a
    # Pod is running is always allowed, regardless of the IP address of the Pod
    # or the node". There is no conformance suite enforcing this for a
    # podSelector-based default-deny policy such as this one, but it holds in
    # practice on the common CNIs this organisation runs, so a kubelet
    # liveness/readiness probe, which originates from the node, needs no
    # ingress rule of its own here.
    - from:
        - podSelector:
            matchLabels:
              {{- include "ostendorf-tech.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.feed.service.port }}
  egress:
    # DNS. No "to": the cluster's DNS Service's own namespace and pod labels
    # are not something this chart can know in advance across every cluster it
    # might be installed on, and guessing wrong would fail silently at
    # runtime, indistinguishable from a Meta outage, rather than at render
    # time. Restricting only the port, not the destination, is the standard,
    # widely used exception for exactly this reason.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # OpenBao. No "to": feed.networkPolicy.openBaoPort is kept as its own
    # explicit value, rather than parsed out of feed.config.openBaoAddr's URL,
    # because Helm's templating has no clean way to read a URL's port
    # (sprig's urlParse returns host and hostname, not a separate port field),
    # and a value that must be kept in sync by the installer, with a
    # documented, named default, is clearer and more easily copied into the
    # organisation's other two NetworkPolicies than URL-parsing logic would be.
    - ports:
        - protocol: TCP
          port: {{ .Values.feed.networkPolicy.openBaoPort }}
    # Meta's Graph API over HTTPS. No "to": not scoped by destination because
    # Meta serves this from a CDN with no fixed, documentable IP range.
    - ports:
        - protocol: TCP
          port: 443
{{- end -}}
