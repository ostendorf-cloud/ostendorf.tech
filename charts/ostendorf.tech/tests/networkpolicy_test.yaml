suite: feed NetworkPolicy
templates:
  - templates/networkpolicy.yaml
set:
  existingSecret:
    name: ostendorf-tech-secrets
  feed:
    enabled: true
    config:
      openBaoAddr: https://openbao.openbao.svc.cluster.local:8200
      openBaoRole: ostendorf-tech-feed
tests:
  - it: renders nothing when feed.enabled is false, the default, even though feed.networkPolicy.enabled defaults to true
    set:
      feed:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders by default once feed.enabled is true, since feed.networkPolicy.enabled defaults to true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy

  - it: selects only the feed service's own pods
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: ostendorf-tech-feed

  - it: governs both ingress and egress
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
            - Egress

  - it: allows exactly one ingress rule, from the API's own pods only, on feed.service.port
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1
      - lengthEqual:
          path: spec.ingress[0].from
          count: 1
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: ostendorf-tech-api
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8081

  # A hardcoded label would still match the default name, so the override is
  # what proves the selector comes from the shared selectorLabels helper.
  - it: follows a non-default nameOverride for the ingress rule's API selector
    set:
      nameOverride: custom-site
    asserts:
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: custom-site-api

  - it: never admits the frontend's pods
    asserts:
      - notEqual:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: ostendorf-tech-frontend

  - it: follows a non-default feed.service.port for the ingress rule, proving it is not hardcoded
    set:
      feed:
        service:
          port: 9090
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 9090

  - it: allows exactly three egress rules
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 3

  - it: allows DNS egress on UDP and TCP 53, scoped to kube-dns's own default namespace and pod label
    asserts:
      - equal:
          path: spec.egress[0].ports
          value:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["k8s-app"]
          value: kube-dns

  - it: follows a non-default feed.networkPolicy.dns selector, proving it is value-driven
    set:
      feed:
        networkPolicy:
          dns:
            namespaceSelector:
              kubernetes.io/metadata.name: custom-dns
            podSelector:
              k8s-app: null
              app: custom-coredns
    asserts:
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: custom-dns
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["app"]
          value: custom-coredns
      - notExists:
          path: spec.egress[0].to[0].podSelector.matchLabels["k8s-app"]

  - it: replaces the default DNS namespaceSelector key when the override nulls it, the same per-key merge as podSelector
    set:
      feed:
        networkPolicy:
          dns:
            namespaceSelector:
              kubernetes.io/metadata.name: null
              team: platform
    asserts:
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["team"]
          value: platform
      - notExists:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]

  - it: falls back to no destination restriction for DNS when both selectors are set to null
    set:
      feed:
        networkPolicy:
          dns:
            namespaceSelector: null
            podSelector: null
    asserts:
      - isNull:
          path: spec.egress[0].to

  - it: allows OpenBao egress on the documented default port, scoped to its own default namespace
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 8200
      - equal:
          path: spec.egress[1].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: openbao
      - isNull:
          path: spec.egress[1].to[0].podSelector

  - it: follows a non-default feed.networkPolicy.openBaoPort for the OpenBao egress rule, proving it is value-driven
    set:
      feed:
        networkPolicy:
          openBaoPort: 8300
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 8300

  - it: follows a non-default feed.networkPolicy.openBao selector, proving it is value-driven
    set:
      feed:
        networkPolicy:
          openBao:
            namespaceSelector:
              kubernetes.io/metadata.name: custom-openbao
            podSelector:
              app.kubernetes.io/name: openbao
    asserts:
      - equal:
          path: spec.egress[1].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: custom-openbao
      - equal:
          path: spec.egress[1].to[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: openbao

  # The case above overrides namespaceSelector under its own default key
  # (kubernetes.io/metadata.name), which Helm's map merge overwrites cleanly. This
  # case overrides it under a different key, which Helm's map merge adds
  # alongside the default key instead: proves the same per-key merge trap as
  # feed.networkPolicy.dns.podSelector applies here too, and that nulling the
  # specific default key replaces it rather than adding to it.
  - it: replaces the default OpenBao namespaceSelector key when the override nulls it, the same per-key merge as dns.podSelector
    set:
      feed:
        networkPolicy:
          openBao:
            namespaceSelector:
              kubernetes.io/metadata.name: null
              team: platform
    asserts:
      - equal:
          path: spec.egress[1].to[0].namespaceSelector.matchLabels["team"]
          value: platform
      - notExists:
          path: spec.egress[1].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]

  - it: keeps only the override key for the OpenBao podSelector, with no default key in place today to collide
    set:
      feed:
        networkPolicy:
          openBao:
            podSelector:
              app: openbao
    asserts:
      - equal:
          path: spec.egress[1].to[0].podSelector.matchLabels
          value:
            app: openbao

  - it: falls back to no destination restriction for OpenBao when namespaceSelector is set to null
    set:
      feed:
        networkPolicy:
          openBao:
            namespaceSelector: null
    asserts:
      - isNull:
          path: spec.egress[1].to

  - it: allows Meta's Graph API egress on HTTPS with no destination restriction, deliberately left unscoped
    asserts:
      - equal:
          path: spec.egress[2].ports[0].port
          value: 443
      - isNull:
          path: spec.egress[2].to

  - it: renders nothing when feed.networkPolicy.enabled is false
    set:
      feed:
        networkPolicy:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
