suite: feed ServiceAccount
templates:
  - templates/serviceaccount-feed.yaml
  - templates/deployment-feed.yaml
set:
  existingSecret:
    name: ostendorf-tech-secrets
  feed:
    config:
      openBaoAddr: https://openbao.openbao.svc.cluster.local:8200
      openBaoRole: ostendorf-tech-feed
tests:
  - it: creates a ServiceAccount with no RBAC by default
    template: templates/serviceaccount-feed.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ostendorf-tech-feed

  - it: never auto-mounts the ServiceAccount token
    template: templates/serviceaccount-feed.yaml
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: renders no ServiceAccount when feed.serviceAccount.create is false
    template: templates/serviceaccount-feed.yaml
    set:
      feed:
        serviceAccount:
          create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: falls back to the "default" ServiceAccount name for the pod when feed.serviceAccount.create is false
    template: templates/deployment-feed.yaml
    set:
      feed:
        serviceAccount:
          create: false
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
