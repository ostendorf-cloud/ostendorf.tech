suite: replicaCount above 1
templates:
  - templates/deployment.yaml
set:
  existingSecret:
    name: ostendorf-tech-secrets
  replicaCount: 3
tests:
  - it: fails the render with the per process limits explanation
    asserts:
      - failedTemplate:
          errorMessage: >-
            replicaCount must stay at 1: govue's contact form keeps its rate limits, its
            global mail ceiling and its proof of work replay set in the memory of one
            process. Every replica has its own, so two replicas double every budget, the
            mail ceiling included, and a solved challenge can be used once per replica.
            Raise replicaCount only after those move to a shared store; see AGENTS.md.
