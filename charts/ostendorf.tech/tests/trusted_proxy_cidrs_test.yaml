suite: config.trustedProxyCidrs required behind ingress
templates:
  - templates/deployment.yaml
set:
  existingSecret:
    name: ostendorf-tech-secrets
  feed:
    config:
      openBaoAddr: https://openbao.openbao.svc.cluster.local:8200
      openBaoRole: ostendorf-tech-feed
tests:
  - it: fails the render when ingress is enabled and trustedProxyCidrs is left empty
    set:
      ingress:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: >-
            config.trustedProxyCidrs must be set when ingress.enabled is true:
            clientip.NewResolver with no trusted prefixes attributes every request to its
            TCP peer, which behind this chart's own Ingress is the ingress controller's
            pod IP. Every rate limiter then keys on that one address, collapsing the
            whole site's traffic into one shared bucket (roughly 20 page loads per minute
            site-wide, and five contact submissions blocking the form for every visitor
            for ContactRateLimitPer). Set it to the ingress controller's pod or Service
            CIDR; see README.md.

  - it: renders fine and wires TRUSTED_PROXY_CIDRS when ingress is enabled and it is set
    set:
      ingress:
        enabled: true
      config:
        trustedProxyCidrs: "10.0.0.0/8"
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTED_PROXY_CIDRS
            value: "10.0.0.0/8"
