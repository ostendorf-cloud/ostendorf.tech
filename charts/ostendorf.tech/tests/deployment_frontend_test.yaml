suite: frontend Deployment, Service and ServiceAccount
templates:
  - templates/deployment-frontend.yaml
  - templates/service-frontend.yaml
  - templates/serviceaccount-frontend.yaml
set:
  # The frontend needs no Secret, and the API's required name is not rendered by
  # these templates: no existingSecret is set here on purpose.
  existingSecret:
    name: ""
tests:
  - it: renders a Deployment named after the frontend with its own selector labels
    template: templates/deployment-frontend.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ostendorf-tech-frontend
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: ostendorf-tech-frontend
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: frontend
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: ostendorf-tech-frontend
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: ostendorf-tech-frontend

  - it: runs the frontend image at the chart's appVersion, the same tag as the API
    template: templates/deployment-frontend.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/ostendorf-cloud/ostendorf-tech-frontend:0.1.0

  - it: follows frontend.image.tag when set
    template: templates/deployment-frontend.yaml
    set:
      frontend:
        image:
          tag: v9.9.9
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/ostendorf-cloud/ostendorf-tech-frontend:v9.9.9

  - it: is stateless, so one replica by default, more allowed, and rolls instead of recreating
    template: templates/deployment-frontend.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: RollingUpdate

  - it: allows more than one replica
    template: templates/deployment-frontend.yaml
    set:
      frontend:
        replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: exposes the http and the admin container port
    template: templates/deployment-frontend.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: admin
              containerPort: 8081
              protocol: TCP

  - it: probes healthz for liveness and readyz for readiness on the admin port, never the public one
    template: templates/deployment-frontend.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value:
            path: /healthz
            port: admin
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /readyz
            port: admin
      - isNull:
          path: spec.template.spec.containers[0].startupProbe

  - it: probes healthz for startup on the admin port when enabled
    template: templates/deployment-frontend.yaml
    set:
      frontend:
        startupProbe:
          enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet
          value:
            path: /healthz
            port: admin

  - it: wires the shared config block into the environment
    template: templates/deployment-frontend.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: "86MiB"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LISTEN_ADDR
            value: ":8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_ADDR
            value: ":8081"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SITE_URL
            value: "https://ostendorf.tech"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "info"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALLOW_PLAIN_HTTP
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RATE_LIMIT_BURST
            value: "120"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RATE_LIMIT_PER
            value: "1m"

  - it: follows the shared config values when they change
    template: templates/deployment-frontend.yaml
    set:
      config:
        siteUrl: https://example.test
        logLevel: debug
        trustedProxies: 10.0.0.0/8
        rateLimitBurst: 7
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SITE_URL
            value: "https://example.test"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "debug"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTED_PROXIES
            value: "10.0.0.0/8"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RATE_LIMIT_BURST
            value: "7"

  - it: omits TRUSTED_PROXIES and every UMAMI variable by default
    template: templates/deployment-frontend.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTED_PROXIES
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_WEBSITE_ID
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_TIMEOUT
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_QUEUE_SIZE
          any: true

  - it: counts page views against the Umami it is pointed at
    template: templates/deployment-frontend.yaml
    set:
      config:
        umamiUrl: http://umami.umami.svc.cluster.local
        umamiWebsiteId: 0f1e2d3c-4b5a-4968-8776-655443322110
        umamiTimeout: 2s
        umamiQueueSize: 100
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_URL
            value: "http://umami.umami.svc.cluster.local"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_WEBSITE_ID
            value: "0f1e2d3c-4b5a-4968-8776-655443322110"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_TIMEOUT
            value: "2s"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_QUEUE_SIZE
            value: "100"

  - it: carries no CONTACT, SMTP, CHALLENGE or FEED variable, those belong to the API
    template: templates/deployment-frontend.yaml
    set:
      config:
        smtpHost: mail.example.test
      feed:
        enabled: true
        config:
          openBaoAddr: https://openbao.openbao.svc.cluster.local:8200
          openBaoRole: ostendorf-tech-feed
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_HOST
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONTACT_TO
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: FEED_SERVICE_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_KEY
          any: true

  # The frontend holds no secret: no env var reads a Secret, and no volume
  # exists at all.
  - it: references no Secret anywhere, even with every API secret key configured
    template: templates/deployment-frontend.yaml
    set:
      existingSecret:
        name: ostendorf-tech-secrets
        challengeKeyKey: CHALLENGE_KEY
        challengeKeyPreviousKey: CHALLENGE_KEY_PREVIOUS
        smtpUsernameKey: SMTP_USERNAME
        smtpPasswordKey: SMTP_PASSWORD
    asserts:
      # An env entry with a valueFrom (a secretKeyRef or any other reference)
      # must not exist: the filter selects exactly those entries.
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.valueFrom)]
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
      - notExists:
          path: spec.template.spec.containers[0].envFrom
      - notExists:
          path: spec.template.spec.initContainers

  - it: references no Secret with every optional value set either
    template: templates/deployment-frontend.yaml
    set:
      config:
        trustedProxies: 10.0.0.0/8
        umamiUrl: http://umami.umami.svc.cluster.local
        umamiWebsiteId: 0f1e2d3c-4b5a-4968-8776-655443322110
        umamiTimeout: 2s
        umamiQueueSize: 100
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.valueFrom)]
      - notExists:
          path: spec.template.spec.volumes

  - it: never sets FRONTEND_DEV_API_PROXY, the development only variable
    template: templates/deployment-frontend.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: FRONTEND_DEV_API_PROXY
          any: true

  - it: sets the same pod and container security contexts as the API
    template: templates/deployment-frontend.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

  - it: never auto-mounts the ServiceAccount token, on the pod or the ServiceAccount
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: templates/deployment-frontend.yaml
      - equal:
          path: automountServiceAccountToken
          value: false
        template: templates/serviceaccount-frontend.yaml

  - it: runs as its own ServiceAccount
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-ostendorf-tech-frontend
        template: templates/deployment-frontend.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ostendorf-tech-frontend
        template: templates/serviceaccount-frontend.yaml

  - it: renders no ServiceAccount when frontend.serviceAccount.create is false
    template: templates/serviceaccount-frontend.yaml
    set:
      frontend:
        serviceAccount:
          create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders GOMEMLIMIT below the memory limit by default and none when empty
    template: templates/deployment-frontend.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 96Mi

  - it: renders no GOMEMLIMIT when frontend.goMemLimit is empty
    template: templates/deployment-frontend.yaml
    set:
      frontend:
        goMemLimit: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
          any: true

  - it: refuses a goMemLimit at or above the memory limit
    template: templates/deployment-frontend.yaml
    set:
      frontend:
        goMemLimit: 96MiB
    asserts:
      - failedTemplate:
          errorPattern: "frontend.goMemLimit must be below frontend.resources.limits.memory"

  - it: renders a ClusterIP Service with the http and the admin port, selecting only the frontend's pods
    template: templates/service-frontend.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ostendorf-tech-frontend
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 8080
              targetPort: http
              protocol: TCP
            - name: admin
              port: 8081
              targetPort: admin
              protocol: TCP
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: ostendorf-tech-frontend

  - it: never selects the API's or the feed's pods
    template: templates/service-frontend.yaml
    asserts:
      - notEqual:
          path: spec.selector["app.kubernetes.io/name"]
          value: ostendorf-tech-api
      - notEqual:
          path: spec.selector["app.kubernetes.io/name"]
          value: ostendorf-tech-feed
