suite: deployment with the optional secret keys configured
templates:
  - templates/deployment.yaml
set:
  existingSecret:
    name: ostendorf-tech-secrets
    challengeKeyKey: CHALLENGE_KEY
    challengeKeyPreviousKey: CHALLENGE_KEY_PREVIOUS
    smtpUsernameKey: SMTP_USERNAME
    smtpPasswordKey: SMTP_PASSWORD
tests:
  - it: wires the proof of work challenge key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_KEY
            valueFrom:
              secretKeyRef:
                name: ostendorf-tech-secrets
                key: CHALLENGE_KEY

  - it: wires the previous challenge key, for a rotation in flight
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_KEY_PREVIOUS
            valueFrom:
              secretKeyRef:
                name: ostendorf-tech-secrets
                key: CHALLENGE_KEY_PREVIOUS

  - it: reads the SMTP credentials from files, not from the environment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_USERNAME_FILE
            value: /run/secrets/smtp/username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD_FILE
            value: /run/secrets/smtp/password
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_USERNAME
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD
          any: true

  - it: mounts the two SMTP keys of the Secret read only
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: smtp-credentials
            mountPath: /run/secrets/smtp
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: smtp-credentials
            secret:
              secretName: ostendorf-tech-secrets
              defaultMode: 288
              items:
                - key: SMTP_USERNAME
                  path: username
                - key: SMTP_PASSWORD
                  path: password
