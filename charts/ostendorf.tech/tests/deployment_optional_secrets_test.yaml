suite: deployment with the optional secret keys configured
templates:
  - templates/deployment.yaml
set:
  existingSecret:
    name: ostendorf-tech-secrets
    challengeKeyKey: CHALLENGE_KEY
    challengeKeyPreviousKey: CHALLENGE_KEY_PREVIOUS
    smtpUsernameKey: SMTP_USERNAME
    smtpPasswordKey: SMTP_PASSWORD
tests:
  - it: reads both challenge keys from files, not from the environment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_KEY_FILE
            value: /run/secrets/challenge/current
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_KEY_PREVIOUS_FILE
            value: /run/secrets/challenge/previous
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_KEY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_KEY_PREVIOUS
          any: true

  - it: mounts the two challenge keys of the Secret read only
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: challenge-keys
            mountPath: /run/secrets/challenge
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: challenge-keys
            secret:
              secretName: ostendorf-tech-secrets
              defaultMode: 288
              items:
                - key: CHALLENGE_KEY
                  path: current
                - key: CHALLENGE_KEY_PREVIOUS
                  path: previous

  - it: has no secretKeyRef in the API container at all
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[*].valueFrom.secretKeyRef.name
          pattern: .+

  - it: reads the SMTP credentials from files, not from the environment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_USERNAME_FILE
            value: /run/secrets/smtp/username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD_FILE
            value: /run/secrets/smtp/password
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_USERNAME
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD
          any: true

  - it: mounts the two SMTP keys of the Secret read only
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: smtp-credentials
            mountPath: /run/secrets/smtp
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: smtp-credentials
            secret:
              secretName: ostendorf-tech-secrets
              defaultMode: 288
              items:
                - key: SMTP_USERNAME
                  path: username
                - key: SMTP_PASSWORD
                  path: password
