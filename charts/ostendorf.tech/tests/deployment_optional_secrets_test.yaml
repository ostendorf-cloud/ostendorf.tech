suite: deployment with the optional secret keys configured
templates:
  - templates/deployment.yaml
set:
  existingSecret:
    name: ostendorf-tech-secrets
    challengeKeyKey: CHALLENGE_KEY
    challengeKeyPreviousKey: CHALLENGE_KEY_PREVIOUS
    smtpUsernameKey: SMTP_USERNAME
    smtpPasswordKey: SMTP_PASSWORD
  feed:
    config:
      openBaoAddr: https://openbao.openbao.svc.cluster.local:8200
      openBaoRole: ostendorf-tech-feed
tests:
  - it: wires the proof of work challenge key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_KEY
            valueFrom:
              secretKeyRef:
                name: ostendorf-tech-secrets
                key: CHALLENGE_KEY

  - it: wires the previous challenge key, for a rotation in flight
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_KEY_PREVIOUS
            valueFrom:
              secretKeyRef:
                name: ostendorf-tech-secrets
                key: CHALLENGE_KEY_PREVIOUS

  - it: wires the SMTP credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_USERNAME
            valueFrom:
              secretKeyRef:
                name: ostendorf-tech-secrets
                key: SMTP_USERNAME
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ostendorf-tech-secrets
                key: SMTP_PASSWORD
