suite: deployment with the optional secret keys configured
templates:
  - templates/deployment.yaml
set:
  existingSecret:
    name: ostendorf-tech-secrets
    challengeKeyKey: CHALLENGE_KEY
    smtpUsernameKey: SMTP_USERNAME
    smtpPasswordKey: SMTP_PASSWORD
tests:
  - it: wires the proof of work challenge key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_KEY
            valueFrom:
              secretKeyRef:
                name: ostendorf-tech-secrets
                key: CHALLENGE_KEY

  - it: wires the SMTP credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_USERNAME
            valueFrom:
              secretKeyRef:
                name: ostendorf-tech-secrets
                key: SMTP_USERNAME
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ostendorf-tech-secrets
                key: SMTP_PASSWORD
