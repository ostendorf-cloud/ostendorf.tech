---
suite: deployment with the Instagram feed and Umami configured
templates:
  - templates/deployment.yaml
tests:
  - it: wires the Instagram access token from the existing Secret
    set:
      existingSecret:
        name: ostendorf-tech-secrets
        instagramTokenKey: INSTAGRAM_TOKEN
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INSTAGRAM_TOKEN
            valueFrom:
              secretKeyRef:
                name: ostendorf-tech-secrets
                key: INSTAGRAM_TOKEN

  - it: reads the token from whatever key the Secret happens to use
    set:
      existingSecret:
        name: ostendorf-tech-secrets
        instagramTokenKey: instagram-access-token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INSTAGRAM_TOKEN
            valueFrom:
              secretKeyRef:
                name: ostendorf-tech-secrets
                key: instagram-access-token

  # The token reaches the pod by reference only. This chart has no values
  # path that could carry the token itself, and creates no Secret of its
  # own to put one in, exactly as for CSRF_KEY and the SMTP credentials.
  - it: never creates a Secret of its own for the token
    set:
      existingSecret:
        name: ostendorf-tech-secrets
        instagramTokenKey: INSTAGRAM_TOKEN
    asserts:
      - hasDocuments:
          count: 1
      - notEqual:
          path: kind
          value: Secret

  - it: carries the Instagram feed settings as plain values
    set:
      existingSecret:
        name: ostendorf-tech-secrets
        instagramTokenKey: INSTAGRAM_TOKEN
      config:
        instagramApiVersion: v24.0
        instagramPostCount: 8
        instagramRefreshInterval: 30m
        instagramTokenRefreshAge: 14d
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INSTAGRAM_API_VERSION
            value: "v24.0"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INSTAGRAM_POST_COUNT
            value: "8"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INSTAGRAM_REFRESH_INTERVAL
            value: "30m"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INSTAGRAM_TOKEN_REFRESH_AGE
            value: "14d"

  - it: reports page views to the Umami it is pointed at
    set:
      existingSecret:
        name: ostendorf-tech-secrets
      config:
        umamiUrl: http://umami.umami.svc.cluster.local
        umamiWebsiteId: 0f1e2d3c-4b5a-4968-8776-655443322110
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_URL
            value: "http://umami.umami.svc.cluster.local"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_WEBSITE_ID
            value: "0f1e2d3c-4b5a-4968-8776-655443322110"

  - it: never mounts an Umami script or any other extra volume for it
    set:
      existingSecret:
        name: ostendorf-tech-secrets
      config:
        umamiUrl: http://umami.umami.svc.cluster.local
        umamiWebsiteId: 0f1e2d3c-4b5a-4968-8776-655443322110
    asserts:
      - isNull:
          path: spec.template.spec.volumes
