suite: ingress and httpRoute are mutually exclusive
templates:
  - templates/deployment.yaml
set:
  existingSecret:
    name: ostendorf-tech-secrets
  feed:
    config:
      openBaoAddr: https://openbao.openbao.svc.cluster.local:8200
      openBaoRole: ostendorf-tech-feed
  config:
    trustedProxyCidrs: "10.0.0.0/8"
  ingress:
    enabled: true
  httpRoute:
    enabled: true
    parentRefs:
      name: shared-gateway
      namespace: gateway-system
tests:
  - it: fails the render when both ingress and httpRoute are enabled
    asserts:
      - failedTemplate:
          errorMessage: >-
            ingress.enabled and httpRoute.enabled cannot both be true: pick one external
            route and turn the other off.
