suite: deployment with no existingSecret.name set
templates:
  - templates/deployment.yaml
set:
  feed:
    config:
      openBaoAddr: https://openbao.openbao.svc.cluster.local:8200
      openBaoRole: ostendorf-tech-feed
tests:
  - it: fails the render with an explanation instead of installing a broken Deployment
    asserts:
      - failedTemplate:
          errorMessage: >-
            existingSecret.name is required: set it to the name of an existing Secret
            carrying CSRF_KEY, which the application needs to start and has no default.
