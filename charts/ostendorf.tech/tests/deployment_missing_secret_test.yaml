suite: deployment with no existingSecret.name set
templates:
  - templates/deployment.yaml
tests:
  - it: fails the render with an explanation instead of installing a site without a contact form
    asserts:
      - failedTemplate:
          errorMessage: >-
            existingSecret.name is required: set it to the name of an existing Secret
            carrying CHALLENGE_KEY and the SMTP credentials, without which the contact
            form answers 503.
