suite: ingress enabled
templates:
  - templates/ingress.yaml
  - templates/httproute.yaml
set:
  existingSecret:
    name: ostendorf-tech-secrets
  feed:
    config:
      openBaoAddr: https://openbao.openbao.svc.cluster.local:8200
      openBaoRole: ostendorf-tech-feed
  config:
    trustedProxies: 10.0.0.0/8
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: ostendorf.tech
tests:
  - it: renders one Ingress for the configured host
    template: templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: ostendorf.tech

  - it: routes /api to the API's Service on its http port
    template: templates/ingress.yaml
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0]
          value:
            path: /api
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-ostendorf-tech-api
                port:
                  number: 8080

  - it: routes / to the frontend's Service on its http port
    template: templates/ingress.yaml
    asserts:
      - equal:
          path: spec.rules[0].http.paths[1]
          value:
            path: /
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-ostendorf-tech-frontend
                port:
                  number: 8080

  - it: routes exactly two paths per host
    template: templates/ingress.yaml
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 2

  - it: gives every host the same two routes
    template: templates/ingress.yaml
    set:
      ingress:
        hosts:
          - host: ostendorf.tech
          - host: www.ostendorf.tech
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 2
      - equal:
          path: spec.rules[1].host
          value: www.ostendorf.tech
      - equal:
          path: spec.rules[1].http.paths[0].path
          value: /api
      - equal:
          path: spec.rules[1].http.paths[0].backend.service.name
          value: RELEASE-NAME-ostendorf-tech-api
      - equal:
          path: spec.rules[1].http.paths[1].path
          value: /
      - equal:
          path: spec.rules[1].http.paths[1].backend.service.name
          value: RELEASE-NAME-ostendorf-tech-frontend

  - it: never routes to the feed service's own Service
    template: templates/ingress.yaml
    asserts:
      - notEqual:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-ostendorf-tech-feed
      - notEqual:
          path: spec.rules[0].http.paths[1].backend.service.name
          value: RELEASE-NAME-ostendorf-tech-feed

  - it: routes only the public ports, never an admin port, even when they differ from their defaults
    template: templates/ingress.yaml
    set:
      service:
        port: 9000
        adminPort: 9001
      frontend:
        service:
          port: 9100
          adminPort: 9101
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 9000
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.port.number
          value: 9100

  - it: renders no HTTPRoute when ingress is the chosen route
    template: templates/httproute.yaml
    asserts:
      - hasDocuments:
          count: 0
