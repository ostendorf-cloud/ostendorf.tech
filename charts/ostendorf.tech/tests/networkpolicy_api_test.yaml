suite: API NetworkPolicy
templates:
  - templates/networkpolicy-api.yaml
set:
  existingSecret:
    name: ostendorf-tech-secrets
  networkPolicy:
    enabled: true
    ingressController:
      namespaceSelector:
        kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        app.kubernetes.io/name: ingress-nginx
tests:
  - it: renders nothing by default, since networkPolicy.enabled defaults to false
    set:
      networkPolicy:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders once enabled, named after the API and selecting only the API's pods
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ostendorf-tech-api
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: ostendorf-tech-api
            app.kubernetes.io/instance: RELEASE-NAME

  - it: governs both ingress and egress
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
            - Egress

  - it: fails the render without the ingress controller's namespaceSelector
    set:
      networkPolicy:
        ingressController:
          namespaceSelector: null
    asserts:
      - failedTemplate:
          errorPattern: "networkPolicy.ingressController.namespaceSelector is required when networkPolicy.enabled is true"

  - it: admits the http port from the ingress controller only, namespace and pod labels together
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1
      - equal:
          path: spec.ingress[0]
          value:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: ingress-nginx
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: ingress-nginx
            ports:
              - protocol: TCP
                port: 8080

  - it: admits the controller's namespace alone when no podSelector is given
    set:
      networkPolicy:
        ingressController:
          podSelector: null
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ingress-nginx

  - it: follows a non-default service.port for the http rule
    set:
      service:
        port: 9000
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 9000

  - it: admits no rule for the admin port without a metrics selector
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1

  - it: admits the admin port from the metrics selector when one is set
    set:
      networkPolicy:
        metrics:
          namespaceSelector:
            kubernetes.io/metadata.name: monitoring
          podSelector:
            app.kubernetes.io/name: prometheus
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 2
      - equal:
          path: spec.ingress[1]
          value:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: prometheus
            ports:
              - protocol: TCP
                port: 8081

  - it: never admits the frontend's or the feed's pods
    asserts:
      - notContains:
          path: spec.ingress
          any: true
          content:
            from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: ostendorf-tech-frontend

  - it: allows DNS egress on UDP and TCP 53 to kube-dns by default, and nothing else without SMTP or the feed
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 1
      - equal:
          path: spec.egress[0]
          value:
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns

  - it: falls back to a port only DNS rule when both DNS selectors are null
    set:
      networkPolicy:
        dns:
          namespaceSelector: null
          podSelector: null
    asserts:
      - isNull:
          path: spec.egress[0].to

  - it: allows SMTP egress to the configured CIDR on config.smtpPort when config.smtpHost is set
    set:
      config:
        smtpHost: mail.example.test
        smtpPort: 465
      networkPolicy:
        smtp:
          cidr: 192.0.2.10/32
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 2
      - equal:
          path: spec.egress[1]
          value:
            ports:
              - protocol: TCP
                port: 465
            to:
              - ipBlock:
                  cidr: 192.0.2.10/32

  - it: fails the render when config.smtpHost is set and networkPolicy.smtp.cidr is not
    set:
      config:
        smtpHost: mail.example.test
    asserts:
      - failedTemplate:
          errorPattern: "networkPolicy.smtp.cidr is required when networkPolicy.enabled and config.smtpHost are set"

  - it: needs no SMTP CIDR while config.smtpHost is empty, and renders no SMTP rule
    asserts:
      - notContains:
          path: spec.egress
          any: true
          content:
            ports:
              - protocol: TCP
                port: 587

  - it: allows egress to the feed pods on the feed port only when the feed is enabled
    set:
      feed:
        enabled: true
        config:
          openBaoAddr: https://openbao.openbao.svc.cluster.local:8200
          openBaoRole: ostendorf-tech-feed
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 2
      - equal:
          path: spec.egress[1]
          value:
            ports:
              - protocol: TCP
                port: 8081
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: ostendorf-tech-feed
                    app.kubernetes.io/instance: RELEASE-NAME

  - it: follows a non-default feed.service.port for the feed rule
    set:
      feed:
        enabled: true
        service:
          port: 9090
        config:
          openBaoAddr: https://openbao.openbao.svc.cluster.local:8200
          openBaoRole: ostendorf-tech-feed
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 9090

  - it: orders DNS, SMTP and feed when all three apply
    set:
      config:
        smtpHost: mail.example.test
      networkPolicy:
        smtp:
          cidr: 192.0.2.10/32
      feed:
        enabled: true
        config:
          openBaoAddr: https://openbao.openbao.svc.cluster.local:8200
          openBaoRole: ostendorf-tech-feed
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 3
      - equal:
          path: spec.egress[1].ports[0].port
          value: 587
      - equal:
          path: spec.egress[2].ports[0].port
          value: 8081

  - it: never reaches Umami, the API counts no page views
    set:
      config:
        umamiUrl: http://umami.umami.svc.cluster.local
        umamiWebsiteId: 0f1e2d3c-4b5a-4968-8776-655443322110
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 1
