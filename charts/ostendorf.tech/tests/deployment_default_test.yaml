suite: deployment with default values
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/serviceaccount.yaml
  - templates/ingress.yaml
  - templates/httproute.yaml
  - templates/deployment-feed.yaml
  - templates/service-feed.yaml
  - templates/serviceaccount-feed.yaml
  - templates/networkpolicy.yaml
  - templates/networkpolicy-api.yaml
  - templates/networkpolicy-frontend.yaml
  - templates/deployment-frontend.yaml
  - templates/service-frontend.yaml
  - templates/serviceaccount-frontend.yaml
set:
  existingSecret:
    name: ostendorf-tech-secrets
tests:
  - it: renders GOMEMLIMIT below the memory limit by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: "172MiB"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 192Mi

  - it: renders no GOMEMLIMIT when goMemLimit is empty
    template: templates/deployment.yaml
    set:
      goMemLimit: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: GOMEMLIMIT

  - it: refuses a goMemLimit at or above the memory limit
    template: templates/deployment.yaml
    set:
      goMemLimit: 192MiB
    asserts:
      - failedTemplate:
          errorPattern: "goMemLimit must be below resources.limits.memory"

  - it: renders exactly one replica
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: recreates instead of rolling, so a rollout never briefly runs two pods
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: carries no CSRF key and no SMTP_ADDR any more
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CSRF_KEY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_ADDR
          any: true

  - it: wires the plain env vars with their documented defaults
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LISTEN_ADDR
            value: ":8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_ADDR
            value: ":8081"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SITE_URL
            value: "https://ostendorf.tech"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONTACT_TO
            value: "simon@ostendorf.tech"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAIL_RATE_LIMIT_BURST
            value: "50"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAIL_RATE_LIMIT_PER
            value: "1h"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FEED_REFRESH_INTERVAL
            value: "5m"

  - it: omits FEED_SERVICE_URL when the feed service is disabled, the default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: FEED_SERVICE_URL

  - it: omits every optional secret-backed env var when its key is not configured
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_KEY_FILE
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_KEY_PREVIOUS_FILE
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_USERNAME_FILE
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD_FILE
          any: true
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  - it: counts no page views in the API, whatever the Umami values
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_URL
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_WEBSITE_ID

  - it: omits TRUSTED_PROXIES when not configured
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTED_PROXIES

  - it: never creates a Secret from plaintext values
    template: templates/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - notEqual:
          path: kind
          value: Secret

  - it: runs as the distroless nonroot uid/gid with a read-only root filesystem
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 65532
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL

  - it: probes healthz for liveness and readyz for readiness, both on the admin port, never the public one
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: admin
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: admin
      - isNull:
          path: spec.template.spec.containers[0].startupProbe

  - it: probes healthz for startup on the admin port when enabled
    template: templates/deployment.yaml
    set:
      startupProbe:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: admin

  - it: exposes both the public and the admin container port
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: admin
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 8081

  - it: always sets resource requests
    template: templates/deployment.yaml
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].resources.requests.cpu
      - isNotNull:
          path: spec.template.spec.containers[0].resources.requests.memory

  - it: sets the standard app.kubernetes.io labels including version and chart version
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ostendorf-tech-api
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: ostendorf-tech-api
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: api
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "0.1.0"
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: ostendorf-tech-0.1.0
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: ostendorf-tech-api
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: ostendorf-tech-api

  - it: runs the API image of the same version tag as the other parts
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/ostendorf-cloud/ostendorf-tech-api:0.1.0

  - it: names its container api, as the frontend's and the feed's are named after their part
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: api

  - it: renders a ClusterIP Service by default, named after the API
    template: templates/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ostendorf-tech-api
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: ostendorf-tech-api
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8080

  - it: exposes the admin port as a second named port on the Service, alongside the public one
    template: templates/service.yaml
    asserts:
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.ports[1].name
          value: admin
      - equal:
          path: spec.ports[1].port
          value: 8081
      - equal:
          path: spec.ports[1].targetPort
          value: admin

  - it: creates a ServiceAccount with no RBAC by default, named after the API
    template: templates/serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ostendorf-tech-api

  - it: runs the API pod as that ServiceAccount
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-ostendorf-tech-api

  - it: never auto-mounts the ServiceAccount token onto the ServiceAccount itself
    template: templates/serviceaccount.yaml
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: never auto-mounts the ServiceAccount token onto the pod either
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: renders no Ingress when disabled
    template: templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no HTTPRoute when disabled
    template: templates/httproute.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders none of the feed service's four objects while feed.enabled is false, the default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/deployment-feed.yaml
      - hasDocuments:
          count: 0
        template: templates/service-feed.yaml
      - hasDocuments:
          count: 0
        template: templates/serviceaccount-feed.yaml
      - hasDocuments:
          count: 0
        template: templates/networkpolicy.yaml

  - it: renders the frontend's Deployment, Service and ServiceAccount but no NetworkPolicy of the API or the frontend by default
    asserts:
      - hasDocuments:
          count: 1
        template: templates/deployment-frontend.yaml
      - hasDocuments:
          count: 1
        template: templates/service-frontend.yaml
      - hasDocuments:
          count: 1
        template: templates/serviceaccount-frontend.yaml
      - hasDocuments:
          count: 0
        template: templates/networkpolicy-api.yaml
      - hasDocuments:
          count: 0
        template: templates/networkpolicy-frontend.yaml
