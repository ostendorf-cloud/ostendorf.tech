suite: httpRoute enabled
templates:
  - templates/httproute.yaml
  - templates/ingress.yaml
set:
  existingSecret:
    name: ostendorf-tech-secrets
  feed:
    config:
      openBaoAddr: https://openbao.openbao.svc.cluster.local:8200
      openBaoRole: ostendorf-tech-feed
  httpRoute:
    enabled: true
    hostnames:
      - ostendorf.tech
    parentRefs:
      name: shared-gateway
      namespace: gateway-system
tests:
  - it: fails the render when httpRoute is enabled and parentRefs.name is left empty
    template: templates/httproute.yaml
    set:
      httpRoute:
        enabled: true
        parentRefs:
          name: ""
          namespace: gateway-system
    asserts:
      - failedTemplate:
          errorMessage: httpRoute.parentRefs.name is required when httpRoute.enabled is true

  - it: fails the render when httpRoute is enabled and parentRefs.namespace is left empty
    template: templates/httproute.yaml
    set:
      httpRoute:
        enabled: true
        parentRefs:
          name: shared-gateway
          namespace: ""
    asserts:
      - failedTemplate:
          errorMessage: >-
            httpRoute.parentRefs.namespace is required when httpRoute.enabled is true: the
            Gateway this HTTPRoute attaches to usually lives in a different namespace than
            this release

  - it: renders exactly one HTTPRoute
    template: templates/httproute.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: gateway.networking.k8s.io/v1
      - isKind:
          of: HTTPRoute

  - it: names the parent Gateway and its namespace in parentRefs
    template: templates/httproute.yaml
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: shared-gateway
      - equal:
          path: spec.parentRefs[0].namespace
          value: gateway-system

  - it: carries the configured hostnames
    template: templates/httproute.yaml
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: ostendorf.tech

  - it: routes the PathPrefix /api to the API's Service on its http port
    template: templates/httproute.yaml
    asserts:
      - equal:
          path: spec.rules[0]
          value:
            matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs:
              - name: RELEASE-NAME-ostendorf-tech-api
                port: 8080

  - it: routes the PathPrefix / to the frontend's Service on its http port
    template: templates/httproute.yaml
    asserts:
      - equal:
          path: spec.rules[1]
          value:
            matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: RELEASE-NAME-ostendorf-tech-frontend
                port: 8080

  - it: has exactly two rules
    template: templates/httproute.yaml
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 2

  - it: never routes to the feed service's own Service
    template: templates/httproute.yaml
    asserts:
      - notEqual:
          path: spec.rules[0].backendRefs[0].name
          value: RELEASE-NAME-ostendorf-tech-feed
      - notEqual:
          path: spec.rules[1].backendRefs[0].name
          value: RELEASE-NAME-ostendorf-tech-feed

  - it: routes only the public ports, never an admin listener, even when they differ from their defaults
    template: templates/httproute.yaml
    set:
      service:
        port: 9000
        adminPort: 9001
      frontend:
        service:
          port: 9100
          adminPort: 9101
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 9000
      - equal:
          path: spec.rules[1].backendRefs[0].port
          value: 9100

  - it: carries no tls field, unlike the Ingress alternative
    template: templates/httproute.yaml
    asserts:
      - isNull:
          path: spec.tls

  - it: renders no Ingress when httpRoute is the chosen route
    template: templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: carries the release labels, not one part's, since it routes to both
    template: templates/httproute.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: ostendorf-tech
      - notExists:
          path: metadata.labels["app.kubernetes.io/component"]
      - notExists:
          path: metadata.labels["app.kubernetes.io/name"]
