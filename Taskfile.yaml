version: "3"

tasks:
  setup:
    desc: Install the pinned toolchain
    cmds:
      - mise trust
      - mise install

  lint:fmt:
    desc: Go format check through golangci-lint
    cmds:
      - golangci-lint fmt --diff

  lint:golangci-config:
    desc: golangci-lint configuration check
    cmds:
      - golangci-lint config verify

  # Both targets typecheck cmd/frontend, whose go:embed pattern fails on an empty
  # dist/, so the frontend has to exist before either one runs.
  lint:vet:
    desc: Go vet
    deps: [web:build, prerender]
    cmds:
      - go vet ./...

  lint:golangci:
    desc: golangci-lint run
    deps: [web:build, prerender]
    cmds:
      - golangci-lint run ./...

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  lint:secrets:
    desc: Secret scan over the git history
    cmds:
      - gitleaks git --no-banner --redact

  lint:docker:
    desc: Dockerfile lint
    cmds:
      - hadolint Dockerfile

  lint:shell:
    desc: Shell lint and format check over scripts/
    cmds:
      - shellcheck scripts/*.sh
      - shfmt --diff --indent 2 --case-indent scripts/*.sh

  # scripts/validate-chart.sh holds the --set combinations, the must-succeed set and the
  # must-fail set alike, so task lint:helm and task validate:kubeconform below check the
  # exact same succeed combinations and CI shares that one definition with a local run.
  # See that script's own header comment for why the must-fail set belongs there and not
  # here: a must-fail case needs helm template's exit code and its guard's exact message,
  # which a single-line Taskfile cmd cannot assert.
  lint:helm:
    desc: Helm chart lint, including a must-fail set proving every render-time guard rejects what it must
    cmds:
      - scripts/validate-chart.sh lint

  validate:kubeconform:
    desc: Schema validation of the rendered Helm chart
    cmds:
      - scripts/validate-chart.sh kubeconform

  # helm-unittest is a Helm plugin, and helm only finds a plugin inside HELM_PLUGINS.
  # The mise entry's postinstall copies it into helm's own plugin directory, but that
  # hook runs only on a fresh install: a cached tool skips it, which is why CI failed
  # on one run and passed on the next with an identical chart. This builds a plugin
  # directory holding exactly one entry, pointing at whatever mise resolved, so the
  # target no longer depends on the hook having run. mise's install parent cannot be
  # used directly: it also holds the version aliases, and helm then sees three plugins
  # all claiming the same name.
  helm:plugins:
    desc: Link helm-unittest into a plugin directory helm can read
    internal: true
    run: once
    cmds:
      - rm -rf .task/helm-plugins
      - mkdir -p .task/helm-plugins
      - ln -s "$(mise where 'github:helm-unittest/helm-unittest')" .task/helm-plugins/unittest

  test:helm:
    desc: Helm chart unit tests
    deps: [helm:plugins]
    env:
      HELM_PLUGINS: .task/helm-plugins
    cmds:
      - helm unittest charts/ostendorf.tech

  build:
    desc: Compile the frontend binary, which embeds the build
    deps: [web:build, prerender]
    cmds:
      - go build -o bin/frontend ./cmd/frontend

  # No web:build/prerender dependency, unlike build above: cmd/api and
  # cmd/feed embed nothing, so building them never needs the frontend. Kept
  # as their own targets rather than folded into build, so this stays true:
  # building either binary would otherwise always pay for the Vue build it
  # does not need.
  build:api:
    desc: Compile the API binary
    cmds:
      - go build -o bin/api ./cmd/api

  build:feed:
    desc: Compile the feed binary
    cmds:
      - go build -o bin/feed ./cmd/feed

  test:go:
    desc: Go test
    deps: [web:build, prerender]
    cmds:
      - go test -race -count=1 ./...

  check:govue-version:
    desc: Verify go.mod and web/package.json pin the same govue version, and that the lockfile pins its subdirectory
    cmds:
      - go test -race -count=1 ./internal/depsync/...

  test:routes:
    desc: Route table conformance, the prerendered output against internal/routes' embedded table
    deps: [web:build, prerender]
    cmds:
      - go test -race -count=1 -run TestPrerenderedOutputMatchesRouteTable ./cmd/frontend/...

  check:build-once:
    desc: Every target that needs the frontend starts web:build and prerender exactly once
    cmds:
      - scripts/check-build-once.sh

  # The web/ half. Every target below runs inside web/ and depends on web:deps,
  # so one of them on its own is enough in a fresh checkout and in CI.
  web:deps:
    desc: Install the web/ dependencies
    dir: web
    run: once
    cmds:
      - pnpm install --frozen-lockfile

  web:lint:
    desc: ESLint over the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run lint

  web:format:
    desc: Prettier format check over the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run format:check

  web:types:
    desc: TypeScript and template typecheck of the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run typecheck

  web:test:
    desc: Vitest suite of the web/ package, including the theme contrast and i18n checks
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run test

  # run: once, because prerender depends on this task and so do lint:vet, build and
  # test:go directly: Task starts the same task once per path in a dependency graph
  # unless it is told otherwise, and two vite builds on cmd/frontend/dist at once make
  # vite:prepare-out-dir fail with ENOTEMPTY. scripts/check-build-once.sh asserts it.
  web:build:
    desc: Build the SPA bundle into cmd/frontend/dist
    dir: web
    run: once
    deps: [web:deps]
    cmds:
      - pnpm run build

  web:fmt:
    desc: Format the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run format

  prerender:
    desc: Render every route of every locale to static HTML into cmd/frontend/dist
    dir: web
    run: once
    deps: [web:build]
    cmds:
      - pnpm run prerender

  # The PNG files are generated output and committed, never edited by hand. Run it again
  # whenever web/public/favicon.svg or the wordmark changes. Follows govue's favicon:generate
  # (same file names, same flags), plus the social preview image: the fader mark and the
  # white wordmark on the favicon's own background colour.
  favicon:generate:
    desc: Generate the favicon PNG files and the social preview image from the SVG sources
    dir: web
    cmds:
      - >-
        magick -background none -density 1200 public/favicon.svg -resize 32x32
        -depth 8 -strip -define png:exclude-chunks=date,time public/favicon-32x32.png
      # The touch icon is opaque: iOS fills transparent pixels with black.
      - >-
        magick -background '#07060f' -density 1200 public/favicon.svg -resize 180x180
        -alpha remove -alpha off -depth 8 -strip -define png:exclude-chunks=date,time
        public/apple-touch-icon.png
      - >-
        magick -size 1200x630 xc:'#07060f'
        \( -background none -density 1200 public/favicon.svg -resize 300x300 \)
        -gravity west -geometry +130+0 -composite
        \( -background none -density 600 src/assets/logo-wordmark-dark.svg -resize 620x \)
        -gravity west -geometry +500+0 -composite
        -alpha remove -alpha off -depth 8 -strip -define png:exclude-chunks=date,time
        public/og-image.png

  check:
    desc: Every check, one after another
    cmds:
      - task: lint:fmt
      - task: lint:golangci-config
      - task: lint:vet
      - task: lint:golangci
      - task: lint:markdown
      - task: lint:yaml
      - task: lint:actions
      - task: lint:secrets
      - task: lint:docker
      - task: lint:shell
      - task: lint:helm
      - task: validate:kubeconform
      - task: test:helm
      - task: web:lint
      - task: web:format
      - task: web:types
      - task: web:test
      - task: web:build
      - task: prerender
      - task: build
      - task: build:api
      - task: build:feed
      - task: test:go
      - task: check:govue-version
      - task: check:build-once
      - task: test:routes

  fmt:
    desc: Format Go code
    cmds:
      - golangci-lint fmt
